openapi: 3.0.0
info:
  title: Entity API
  version: 1.0.0
servers:
  - url: https://api.useautumn.com/v1
security:
  - bearerAuth: []
paths:
  /features:
    get:
      summary: List all features
      operationId: listFeatures
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Features retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: "#/components/schemas/Feature"
      x-code-samples:
        - lang: typescript
          source: |
            const features = await autumn.features.list();
  
  /features/{feature_id}:
    get:
      summary: Get a feature by ID
      operationId: getFeature
      security:
        - bearerAuth: []
      parameters:
        - name: feature_id
          in: path
          required: true
          schema:
            type: string
          description: The feature ID
      responses:
        "200":
          description: Feature retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
        "404":
          description: Feature not found
      x-code-samples:
        - lang: typescript
          source: |
            const feature = await autumn.features.get(featureId);


  /usage:
    post:
      summary: Record usage for a feature
      operationId: recordUsage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordUsageRequest"
      responses:
        "200":
          description: ""
      x-code-samples:
        - lang: typescript
          source: |
            import { Autumn as autumn } from 'autumn-js';

            await autumn.usage({
              customer_id: 'user_123',
              feature_id: 'seats',
              value: 10
            });

        - lang: curl
          source: |
            curl -X POST 'https://api.useautumn.com/v1/usage' \
            -H 'Authorization: Bearer am_sk_1234567890' \
            -H 'Content-Type: application/json' \
            -d '{
              "customer_id": "user_123", 
              "feature_id": "seats",
              "quantity": 1
            }'

        - lang: python
          source: |
            import asyncio
            from autumn import Autumn

            autumn = Autumn('am_sk_1234567890')

            async def main():
                await autumn.features.set_usage(
                    customer_id='user_123',
                    feature_id='seats',
                    value=10,
                )

            asyncio.run(main())

  /customers/{customer_id}/balances:
    post:
      summary: Set balances for features
      operationId: setBalances
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
          description: Your unique identifier for the customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBalancesRequest"
      responses:
        "200":
          description: ""

components:
  schemas:
    Feature:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the feature
        name:
          type: string
          description: The name of the feature
        type:
          type: string
          enum: [boolean, single_use, continuous_use, credit_system]
          description: The type of feature
        display:
          type: object
          nullable: true
          properties:
            singular:
              type: string
            plural:
              type: string
          description: Display names for the feature
        credit_schema:
          type: array
          nullable: true
          items:
            type: object
            properties:
              metered_feature_id:
                type: string
              credit_cost:
                type: number
          description: Credit cost schema for credit system features
        archived:
          type: boolean
          description: Whether the feature is archived

    RecordUsageRequest:
      type: object
      required:
        - feature_id
        - customer_id
        - value
      properties:
        feature_id:
          type: string
          description: The feature ID to set usage for
        customer_id:
          type: string
          description: Your unique identifier for the customer
        value:
          type: number
          description: The usage value to set

    SetBalancesRequest:
      type: object
      required:
        - balances
      properties:
        balances:
          type: array
          items:
            type: object
            required:
              - feature_id
              - balance
            properties:
              feature_id:
                type: string
                description: The identifier of the feature
              balance:
                type: number
                description: The balance value to set for the feature

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
