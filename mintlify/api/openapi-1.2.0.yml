  /check:
    post:
      summary: Check Feature Access
      description: |-
        Check whether a customer has access to a product, feature or remaining usage.

        @example
        ```typescript
        // Check feature access
        const response = await client.check({
            "customer_id": "cus_123",
            "feature_id": "api_calls"
          });
        ```

        @param body.customer_id - The ID of the customer to check
        @param body.feature_id - The ID of the feature to check access for
        @param body.product_id - The ID of the product to check
        @param body.entity_id - The ID of the entity (optional)
        @param body.customer_data - Customer data to create or update the customer if they don't exist
        @param body.required_balance - The required balance for the check
        @param body.send_event - Whether to send a usage event if allowed
        @param body.with_preview - Whether to include preview information in the response
        @param body.entity_data - Entity data to create the entity if it doesn't exist
      tags:
        - core
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  description: The ID of the customer to check
                  example: cus_123
                  type: string
                feature_id:
                  description: The ID of the feature to check access for
                  example: api_calls
                  type: string
                product_id:
                  description: The ID of the product to check
                  example: pro_plan
                  type: string
                entity_id:
                  description: The ID of the entity (optional)
                  example: entity_123
                  type: string
                customer_data:
                  description: Customer data to create or update the customer if they don't exist
                  type: object
                  properties:
                    name:
                      description: Customer's name
                      example: John Doe
                      anyOf:
                        - type: string
                        - type: 'null'
                    email:
                      description: Customer's email address
                      example: john@example.com
                      anyOf:
                        - type: string
                        - type: 'null'
                    fingerprint:
                      description: >-
                        Unique identifier (eg, serial number) to detect duplicate customers and prevent free
                        trial abuse
                      example: fp_123abc
                      anyOf:
                        - type: string
                        - type: 'null'
                    metadata:
                      description: Additional metadata for the customer
                      example:
                        company: Acme Inc
                      anyOf:
                        - type: object
                          propertyNames: {}
                          additionalProperties: {}
                        - type: 'null'
                    stripe_id:
                      description: Stripe customer ID if you already have one
                      example: cus_stripe123
                      anyOf:
                        - type: string
                        - type: 'null'
                required_balance:
                  description: The required balance for the check
                  example: 1
                  type: number
                send_event:
                  description: Whether to send a usage event if allowed
                  example: true
                  type: boolean
                with_preview:
                  description: Whether to include preview information in the response
                  example: true
                  type: boolean
                entity_data:
                  description: Entity data to create the entity if it doesn't exist
                  type: object
                  properties:
                    feature_id:
                      description: The feature ID that this entity is associated with
                      example: seats
                      type: string
                    name:
                      description: Name of the entity
                      example: Team Alpha
                      type: string
                  required:
                    - feature_id
              required:
                - customer_id
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    description: Whether the customer is allowed to use the feature
                    example: true
                    type: boolean
                  customer_id:
                    description: The ID of the customer
                    example: cus_123
                    type: string
                  feature_id:
                    description: The ID of the feature checked
                    example: api_calls
                    type: string
                  entity_id:
                    description: The ID of the entity (if provided)
                    example: entity_123
                    anyOf:
                      - type: string
                      - type: 'null'
                  required_balance:
                    description: The required balance for this check
                    example: 1
                    type: number
                  code:
                    description: Response code indicating the result
                    example: allowed
                    type: string
                  preview:
                    description: Preview information if with_preview was true
                    type: object
                    properties:
                      scenario:
                        type: string
                        enum:
                          - usage_limit
                          - feature_flag
                      title:
                        description: Title for the preview message
                        example: Usage Limit Reached
                        type: string
                      message:
                        description: Detailed message explaining the check result
                        example: You've reached your usage limit. Upgrade to continue.
                        type: string
                      feature_id:
                        description: The ID of the feature
                        example: api_calls
                        type: string
                      feature_name:
                        description: The name of the feature
                        example: API Calls
                        type: string
                      products:
                        description: Available products that include this feature
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              description: The ID of the product you set when creating the product
                              example: pro_plan
                              type: string
                            name:
                              description: The name of the product
                              example: Pro Plan
                              type: string
                            group:
                              description: The group of the product
                              example: product_set_1
                              anyOf:
                                - type: string
                                - type: 'null'
                            env:
                              description: The environment of the product
                              example: production
                              type: string
                              enum:
                                - sandbox
                                - live
                            is_add_on:
                              description: Whether the product is an add-on and can be purchased alongside other products
                              example: true
                              type: boolean
                            is_default:
                              description: Whether the product is the default product
                              example: true
                              type: boolean
                            archived:
                              description: Whether this product has been archived and is no longer available
                              example: false
                              type: boolean
                            version:
                              description: The version of the product
                              example: 1
                              type: number
                            created_at:
                              description: The timestamp of when the product was created in milliseconds since epoch
                              example: 1759247877000
                              type: number
                            items:
                              description: Array of product items that define the features and pricing
                              example:
                                - feature_id: <string>
                                  feature_type: single_use
                                  included_usage: 123
                                  interval: <string>
                                  usage_model: prepaid
                                  price: 123
                                  billing_units: 123
                                  entity_feature_id: <string>
                                  reset_usage_when_enabled: true
                                  tiers:
                                    - to: 123
                                      amount: 123
                              type: array
                              items:
                                $ref: '#/components/schemas/ProductItemOutput'
                            free_trial:
                              description: Free trial configuration for this product, if available
                              example:
                                duration: <string>
                                length: 123
                                unique_fingerprint: true
                              anyOf:
                                - type: object
                                  properties:
                                    duration:
                                      description: The duration type of the free trial
                                      example: <string>
                                      type: string
                                      enum:
                                        - day
                                        - month
                                        - year
                                    length:
                                      description: The length of the free trial
                                      example: 123
                                      type: number
                                    unique_fingerprint:
                                      description: Whether the free trial is limited to one per customer fingerprint
                                      example: true
                                      type: boolean
                                    card_required:
                                      description: Whether the free trial requires a card
                                      example: true
                                      type: boolean
                                    trial_available:
                                      description: Whether the free trial is available
                                      example: true
                                      default: true
                                      anyOf:
                                        - type: boolean
                                        - type: 'null'
                                  required:
                                    - duration
                                    - length
                                    - unique_fingerprint
                                    - card_required
                                    - trial_available
                                  additionalProperties: false
                                - type: 'null'
                            base_variant_id:
                              description: ID of the base variant this product is derived from
                              example: var_1234567890abcdef
                              anyOf:
                                - type: string
                                - type: 'null'
                            scenario:
                              description: Scenario context for when this product is used in attach flows
                              example: upgrade
                              type: string
                              enum:
                                - scheduled
                                - active
                                - new
                                - renew
                                - upgrade
                                - downgrade
                                - cancel
                                - expired
                                - past_due
                            properties:
                              description: Additional properties and metadata for the product
                              example:
                                is_free: false
                                is_one_off: false
                                interval_group: monthly
                                has_trial: true
                                updateable: true
                              type: object
                              properties:
                                is_free:
                                  description: True if the product has no base price or usage prices
                                  example: false
                                  type: boolean
                                is_one_off:
                                  description: True if the product only contains a one-time price
                                  example: false
                                  type: boolean
                                interval_group:
                                  description: >-
                                    The billing interval group for recurring products (e.g., 'monthly',
                                    'yearly')
                                  example: monthly
                                  anyOf:
                                    - type: string
                                    - type: 'null'
                                has_trial:
                                  description: True if the product includes a free trial
                                  example: true
                                  anyOf:
                                    - type: boolean
                                    - type: 'null'
                                updateable:
                                  description: >-
                                    True if the product can be updated after creation (only applicable if
                                    there are prepaid recurring prices)
                                  example: true
                                  anyOf:
                                    - type: boolean
                                    - type: 'null'
                              required:
                                - is_free
                                - is_one_off
                              additionalProperties: false
                          required:
                            - id
                            - name
                            - group
                            - env
                            - is_add_on
                            - is_default
                            - archived
                            - version
                            - created_at
                            - items
                            - free_trial
                            - base_variant_id
                          additionalProperties: false
                    required:
                      - scenario
                      - title
                      - message
                      - feature_id
                      - feature_name
                      - products
                    additionalProperties: false
                  interval:
                    description: The billing interval or 'multiple' if the feature has multiple intervals
                    example: month
                    anyOf:
                      - anyOf:
                          - type: string
                            enum:
                              - lifetime
                              - minute
                              - hour
                              - day
                              - week
                              - month
                              - quarter
                              - semi_annual
                              - year
                          - type: string
                            const: multiple
                      - type: 'null'
                  interval_count:
                    description: The number of intervals between resets
                    example: 1
                    anyOf:
                      - type: number
                      - type: 'null'
                  unlimited:
                    description: Whether the feature has unlimited usage
                    example: false
                    anyOf:
                      - type: boolean
                      - type: 'null'
