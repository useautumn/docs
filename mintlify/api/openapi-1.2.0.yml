              created_at:
                description: Timestamp when the invoice was created
                example: 1759247877000
                type: number
              hosted_invoice_url:
                description: URL to the Stripe-hosted invoice page
                example: https://invoice.stripe.com/i/acct_123/test_456
                anyOf:
                  - type: string
                  - type: 'null'
            required:
              - product_ids
              - stripe_id
              - status
              - total
              - currency
              - created_at
            additionalProperties: false
        entities:
          type: array
          items:
            type: object
            properties:
              id:
                description: The unique identifier of the entity
                example: <string>
                anyOf:
                  - type: string
                  - type: 'null'
              name:
                description: The name of the entity
                example: <string>
                anyOf:
                  - type: string
                  - type: 'null'
              customer_id:
                description: The customer ID this entity belongs to
                example: <string>
                anyOf:
                  - type: string
                  - type: 'null'
              feature_id:
                anyOf:
                  - type: string
                  - type: 'null'
              created_at:
                description: Unix timestamp when the entity was created
                example: 1686168121
                type: number
              env:
                description: The environment (sandbox/live)
                example: live
                type: string
                enum:
                  - sandbox
                  - live
            required:
              - id
              - name
              - created_at
              - env
            additionalProperties: false
        trials_used:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: string
              customer_id:
                type: string
              fingerprint:
                anyOf:
                  - type: string
                  - type: 'null'
            required:
              - product_id
              - customer_id
            additionalProperties: false
        rewards:
          anyOf:
            - type: object
              properties:
                discounts:
                  description: Array of active discounts applied to the customer
                  example:
                    - id: disc_123456
                      name: SUMMER20
                      type: percentage
                      discount_value: 20
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        description: The unique identifier for this discount
                        example: disc_123456
                        type: string
                      name:
                        description: The name of the discount or coupon
                        example: SUMMER20
                        type: string
                      type:
                        description: The type of reward
                        example: percentage
                        type: string
                        enum:
                          - percentage_discount
                          - fixed_discount
                          - free_product
                          - invoice_credits
                      discount_value:
                        description: The discount value (percentage or fixed amount)
                        example: 20
                        type: number
                      duration_type:
                        description: How long the discount lasts
                        example: forever
                        type: string
                        enum:
                          - one_off
                          - months
                          - forever
                      duration_value:
                        description: Number of billing periods the discount applies for repeating durations
                        example: 3
                        anyOf:
                          - type: number
                          - type: 'null'
                      currency:
                        description: The currency code for fixed amount discounts
                        example: usd
                        anyOf:
                          - type: string
                          - type: 'null'
                      start:
                        description: Timestamp when the discount becomes active
                        example: 1759247877000
                        anyOf:
                          - type: number
                          - type: 'null'
                      end:
                        description: Timestamp when the discount expires
                        example: 1761839877000
                        anyOf:
                          - type: number
                          - type: 'null'
                      subscription_id:
                        description: The Stripe subscription ID this discount is applied to
                        example: sub_1A2B3C4D5E6F7G8H
                        anyOf:
                          - type: string
                          - type: 'null'
                      total_discount_amount:
                        description: Total amount saved from this discount
                        example: 599
                        anyOf:
                          - type: number
                          - type: 'null'
                    required:
                      - id
                      - name
                      - type
                      - discount_value
                      - duration_type
                    additionalProperties: false
              required:
                - discounts
              additionalProperties: false
            - type: 'null'
        referrals:
          type: array
          items:
            type: object
            properties:
              program_id:
                type: string
              customer:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    anyOf:
                      - type: string
                      - type: 'null'
                  email:
                    anyOf:
                      - type: string
                      - type: 'null'
                required:
                  - id
                additionalProperties: false
              reward_applied:
                type: boolean
              created_at:
                type: number
            required:
              - program_id
              - customer
              - reward_applied
              - created_at
            additionalProperties: false
        upcoming_invoice:
