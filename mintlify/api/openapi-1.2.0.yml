  /cancel:
    post:
      summary: Cancel Product
      description: >-
        Cancel a customer's subscription to a product.


        Use this when a customer wants to stop their subscription. Supports immediate or end-of-period
        cancellation.


        @example

        ```typescript

        // Cancel a subscription

        const response = await client.cancel({
            "customer_id": "cus_123",
            "product_id": "pro_plan"
          });
        ```


        @param body.customer_id - The ID of the customer

        @param body.product_id - The ID of the product to cancel

        @param body.entity_id - The ID of the entity (optional)

        @param body.cancel_immediately - Whether to cancel the product immediately or at period end

        @param body.prorate - Whether to prorate the cancellation (defaults to true if not specified)


        @see {@link https://docs.useautumn.com/api-reference/core/cancel Cancel Subscriptions}
      tags:
        - core
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  description: The ID of the customer
                  example: cus_123
                  type: string
                product_id:
                  description: The ID of the product to cancel
                  example: pro_plan
                  type: string
                entity_id:
                  description: The ID of the entity (optional)
                  example: entity_123
                  anyOf:
                    - type: string
                    - type: 'null'
                cancel_immediately:
                  description: Whether to cancel the product immediately or at period end
                  example: false
                  type: boolean
                prorate:
                  description: Whether to prorate the cancellation (defaults to true if not specified)
                  example: true
                  anyOf:
                    - type: boolean
                    - type: 'null'
              required:
                - customer_id
                - product_id
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    description: Whether the cancellation was successful
                    example: true
                    type: boolean
                  customer_id:
                    description: The ID of the customer
                    example: cus_123
                    type: string
                  product_id:
                    description: The ID of the canceled product
                    example: pro_plan
                    type: string
                required:
                  - success
                  - customer_id
                  - product_id
                additionalProperties: false
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Autumn from '@useautumn/sdk';

            const client = new Autumn({
              secretKey: 'My Secret Key',
            });

            const response = await client.cancel({ customer_id: 'cus_123', product_id: 'pro_plan' });

            console.log(response.customer_id);
        - lang: Python
          source: |-
            from autumn import Autumn

            client = Autumn(
                secret_key="My Secret Key",
            )
            response = client.cancel(
                customer_id="cus_123",
                product_id="pro_plan",
            )
            print(response.customer_id)
  /track:
    post:
      summary: Track Event
      description: |-
        Track usage events for metered features or record analytics events.

        Use this to increment usage counters for pay-as-you-go features or track customer activity.

        @example
        ```typescript
        // Track a usage event
        const response = await client.track({
            "customer_id": "cus_123",
            "feature_id": "api_calls",
            "value": 1
          });
        ```

        @param body.customer_id - The ID of the customer
        @param body.customer_data - Customer data to create or update the customer if they don't exist
        @param body.event_name - The name of the event to track
        @param body.feature_id - The ID of the feature (alternative to event_name for usage events)
        @param body.properties - Additional properties for the event
        @param body.timestamp - Unix timestamp in milliseconds when the event occurred
        @param body.idempotency_key - Idempotency key to prevent duplicate events
        @param body.value - The value/count of the event
        @param body.set_usage - Whether to set the usage to this value instead of increment
        @param body.entity_id - The ID of the entity this event is associated with
        @param body.entity_data - Data for creating the entity if it doesn't exist

        @see {@link https://docs.useautumn.com/api-reference/core/track Usage Tracking}
      tags:
        - core
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  description: The ID of the customer
                  example: cus_123
                  type: string
                  minLength: 1
                customer_data:
                  description: Customer data to create or update the customer if they don't exist
                  anyOf:
                    - type: object
                      properties:
                        name:
                          description: Customer's name
                          example: John Doe
                          anyOf:
                            - type: string
                            - type: 'null'
                        email:
                          description: Customer's email address
                          example: john@example.com
                          anyOf:
                            - type: string
                            - type: 'null'
                        fingerprint:
                          description: >-
                            Unique identifier (eg, serial number) to detect duplicate customers and prevent
                            free trial abuse
                          example: fp_123abc
                          anyOf:
                            - type: string
                            - type: 'null'
                        metadata:
                          description: Additional metadata for the customer
                          example:
                            company: Acme Inc
                          anyOf:
                            - type: object
                              propertyNames: {}
                              additionalProperties: {}
                            - type: 'null'
                        stripe_id:
                          description: Stripe customer ID if you already have one
                          example: cus_stripe123
                          anyOf:
                            - type: string
                            - type: 'null'
                    - type: 'null'
                event_name:
                  description: The name of the event to track
                  example: api_call
                  type: string
                  minLength: 1
                feature_id:
                  description: The ID of the feature (alternative to event_name for usage events)
                  example: api_calls
                  type: string
                properties:
                  description: Additional properties for the event
                  example:
                    endpoint: /api/users
                  anyOf:
                    - type: object
                      propertyNames:
                        type: string
                      additionalProperties: {}
                    - type: 'null'
                timestamp:
                  description: Unix timestamp in milliseconds when the event occurred
                  example: 1717000000000
                  anyOf:
                    - type: number
                    - type: 'null'
                idempotency_key:
                  description: Idempotency key to prevent duplicate events
                  example: evt_abc123
                  anyOf:
                    - type: string
                    - type: 'null'
                value:
                  description: The value/count of the event
                  example: 1
                  anyOf:
                    - type: number
                    - type: 'null'
                set_usage:
                  description: Whether to set the usage to this value instead of increment
                  example: false
                  anyOf:
                    - type: boolean
                    - type: 'null'
                entity_id:
                  description: The ID of the entity this event is associated with
                  example: entity_123
                  anyOf:
                    - type: string
                    - type: 'null'
                entity_data:
                  description: Data for creating the entity if it doesn't exist
                  anyOf:
                    - type: object
                      properties:
                        feature_id:
                          description: The feature ID that this entity is associated with
                          example: seats
                          type: string
                        name:
                          description: Name of the entity
                          example: Team Alpha
                          type: string
                      required:
                        - feature_id
                    - type: 'null'
              required:
                - customer_id
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    description: The ID of the created event
                    example: evt_123
                    type: string
                  code:
                    description: Response code
                    example: event_received
                    type: string
                  customer_id:
                    description: The ID of the customer
                    example: cus_123
                    type: string
                  entity_id:
                    description: The ID of the entity (if provided)
                    example: entity_123
                    type: string
                  event_name:
                    description: The name of the event
                    example: api_call
                    type: string
                  feature_id:
                    description: The ID of the feature (if provided)
                    example: api_calls
                    type: string
                required:
                  - id
                  - code
                  - customer_id
                additionalProperties: false
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Autumn from '@useautumn/sdk';

            const client = new Autumn({
              secretKey: 'My Secret Key',
            });

            const response = await client.track({ customer_id: 'cus_123' });

            console.log(response.id);
        - lang: Python
          source: |-
            from autumn import Autumn

            client = Autumn(
                secret_key="My Secret Key",
            )
            response = client.track(
                customer_id="cus_123",
            )
            print(response.id)
