                          - type: 'null'
                      description:
                        type: string
                      amount:
                        type: number
                    required:
                      - description
                      - amount
                    additionalProperties: false
                discounts:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        description: The unique identifier for this discount
                        example: disc_123456
                        type: string
                      name:
                        description: The name of the discount or coupon
                        example: SUMMER20
                        type: string
                      type:
                        description: The type of reward
                        example: percentage
                        type: string
                        enum:
                          - percentage_discount
                          - fixed_discount
                          - free_product
                          - invoice_credits
                      discount_value:
                        description: The discount value (percentage or fixed amount)
                        example: 20
                        type: number
                      duration_type:
                        description: How long the discount lasts
                        example: forever
                        type: string
                        enum:
                          - one_off
                          - months
                          - forever
                      duration_value:
                        description: Number of billing periods the discount applies for repeating durations
                        example: 3
                        anyOf:
                          - type: number
                          - type: 'null'
                      currency:
                        description: The currency code for fixed amount discounts
                        example: usd
                        anyOf:
                          - type: string
                          - type: 'null'
                      start:
                        description: Timestamp when the discount becomes active
                        example: 1759247877000
                        anyOf:
                          - type: number
                          - type: 'null'
                      end:
                        description: Timestamp when the discount expires
                        example: 1761839877000
                        anyOf:
                          - type: number
                          - type: 'null'
                      subscription_id:
                        description: The Stripe subscription ID this discount is applied to
                        example: sub_1A2B3C4D5E6F7G8H
                        anyOf:
                          - type: string
                          - type: 'null'
                      total_discount_amount:
                        description: Total amount saved from this discount
                        example: 599
                        anyOf:
                          - type: number
                          - type: 'null'
                    required:
                      - id
                      - name
                      - type
                      - discount_value
                      - duration_type
                    additionalProperties: false
                subtotal:
                  type: number
                total:
                  type: number
                currency:
                  type: string
              required:
                - lines
                - discounts
                - subtotal
                - total
                - currency
              additionalProperties: false
            - type: 'null'
        payment_method:
          anyOf:
            - {}
            - type: 'null'
      required:
        - id
        - created_at
        - name
        - email
        - fingerprint
        - stripe_id
        - env
        - metadata
        - products
        - features
      additionalProperties: false
    Product:
      description: A product
      examples:
        - description: A product
          values:
            id: pro_plan
            name: Pro Plan
            group: product_set_1
            env: production
            is_add_on: true
            is_default: true
      type: object
      properties:
        id:
          description: The ID of the product you set when creating the product
          example: pro_plan
          type: string
        name:
          description: The name of the product
          example: Pro Plan
          type: string
        group:
          description: The group of the product
          example: product_set_1
          anyOf:
            - type: string
            - type: 'null'
        env:
          description: The environment of the product
          example: production
          type: string
          enum:
            - sandbox
            - live
        is_add_on:
          description: Whether the product is an add-on and can be purchased alongside other products
          example: true
          type: boolean
        is_default:
          description: Whether the product is the default product
          example: true
          type: boolean
        archived:
          description: Whether this product has been archived and is no longer available
          example: false
          type: boolean
        version:
          description: The version of the product
          example: 1
          type: number
        created_at:
          description: The timestamp of when the product was created in milliseconds since epoch
          example: 1759247877000
          type: number
        items:
          description: Array of product items that define the features and pricing
          example:
            - feature_id: <string>
              feature_type: single_use
              included_usage: 123
              interval: <string>
              usage_model: prepaid
              price: 123
              billing_units: 123
              entity_feature_id: <string>
              reset_usage_when_enabled: true
              tiers:
                - to: 123
                  amount: 123
          type: array
          items:
            $ref: '#/components/schemas/ProductItemOutput'
        free_trial:
          description: Free trial configuration for this product, if available
          example:
            duration: <string>
            length: 123
            unique_fingerprint: true
          anyOf:
            - type: object
              properties:
                duration:
                  description: The duration type of the free trial
                  example: <string>
                  type: string
                  enum:
                    - day
                    - month
                    - year
                length:
                  description: The length of the free trial
                  example: 123
                  type: number
                unique_fingerprint:
                  description: Whether the free trial is limited to one per customer fingerprint
                  example: true
                  type: boolean
                card_required:
                  description: Whether the free trial requires a card
                  example: true
                  type: boolean
                trial_available:
                  description: Whether the free trial is available
                  example: true
                  default: true
                  anyOf:
                    - type: boolean
                    - type: 'null'
              required:
                - duration
                - length
                - unique_fingerprint
                - card_required
                - trial_available
              additionalProperties: false
            - type: 'null'
        base_variant_id:
          description: ID of the base variant this product is derived from
          example: var_1234567890abcdef
          anyOf:
            - type: string
            - type: 'null'
        scenario:
          description: Scenario context for when this product is used in attach flows
          example: upgrade
          type: string
          enum:
            - scheduled
            - active
            - new
            - renew
            - upgrade
            - downgrade
            - cancel
            - expired
            - past_due
        properties:
          description: Additional properties and metadata for the product
          example:
            is_free: false
            is_one_off: false
            interval_group: monthly
            has_trial: true
            updateable: true
          type: object
          properties:
            is_free:
              description: True if the product has no base price or usage prices
              example: false
              type: boolean
            is_one_off:
              description: True if the product only contains a one-time price
              example: false
              type: boolean
            interval_group:
