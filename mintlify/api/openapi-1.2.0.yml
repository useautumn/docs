openapi: 3.1.0
info:
  title: Autumn API
  version: 1.2.0
servers:
  - url: https://api.useautumn.com
    description: Production server
security:
  - secretKey: []
paths:
  /products:
    get:
      summary: List Products
      tags:
        - products
      parameters:
        - in: query
          name: customer_id
          schema:
            type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                required:
                  - list
                additionalProperties: false
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Autumn from '@useautumn/sdk';

            const client = new Autumn({
              secretKey: 'My Secret Key',
            });

            const products = await client.products.list();

            console.log(products.list);
        - lang: Python
          source: |-
            from autumn import Autumn

            client = Autumn(
                secret_key="My Secret Key",
            )
            products = client.products.list()
            print(products.list)
    post:
      summary: Create Product
      tags:
        - products
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  pattern: ^[a-zA-Z0-9_-]+$
                name:
                  type: string
                is_add_on:
                  default: false
                  type: boolean
                is_default:
                  default: false
                  type: boolean
                version:
                  type: number
                group:
                  default: ''
                  anyOf:
                    - type: string
                    - type: 'null'
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      feature_id:
                        anyOf:
                          - type: string
                          - type: 'null'
                      feature_type:
                        anyOf:
                          - type: string
                            enum:
                              - single_use
                              - continuous_use
                              - boolean
                              - static
                          - type: 'null'
                      included_usage:
                        anyOf:
                          - anyOf:
                              - type: number
                              - type: string
                                const: inf
                          - type: 'null'
                      interval:
                        anyOf:
                          - type: string
                            enum:
                              - minute
                              - hour
                              - day
                              - week
                              - month
                              - quarter
                              - semi_annual
                              - year
                          - type: 'null'
                      interval_count:
                        anyOf:
                          - type: number
                          - type: 'null'
                      entity_feature_id:
                        anyOf:
                          - type: string
                          - type: 'null'
                      usage_model:
                        anyOf:
                          - type: string
                            enum:
                              - prepaid
                              - pay_per_use
                          - type: 'null'
                      price:
                        anyOf:
                          - type: number
                          - type: 'null'
                      tiers:
                        anyOf:
                          - type: array
                            items:
                              type: object
                              properties:
                                to:
                                  description: The maximum amount of usage for this tier.
                                  example: 100
                                  anyOf:
                                    - type: number
                                    - type: string
                                      const: inf
                                amount:
                                  description: The price of the product item for this tier.
                                  example: 10
                                  type: number
                              required:
                                - to
                                - amount
                          - type: 'null'
                      billing_units:
                        anyOf:
                          - type: number
                          - type: 'null'
                      usage_limit:
                        anyOf:
                          - type: number
                          - type: 'null'
                      reset_usage_when_enabled:
                        anyOf:
                          - type: boolean
                          - type: 'null'
                      config:
                        anyOf:
                          - type: object
                            properties:
                              on_increase:
                                anyOf:
                                  - type: string
                                    enum:
                                      - bill_immediately
                                      - prorate_immediately
                                      - prorate_next_cycle
                                      - bill_next_cycle
                                  - type: 'null'
                              on_decrease:
                                anyOf:
                                  - type: string
                                    enum:
                                      - prorate
                                      - prorate_immediately
                                      - prorate_next_cycle
                                      - none
                                      - no_prorations
                                  - type: 'null'
                              rollover:
                                anyOf:
                                  - type: object
                                    properties:
                                      max:
                                        anyOf:
                                          - type: number
                                          - type: 'null'
                                      duration:
                                        default: month
                                        type: string
                                        enum:
                                          - month
                                          - forever
                                      length:
                                        type: number
                                    required:
                                      - max
                                      - length
                                  - type: 'null'
                          - type: 'null'
                      display:
                        anyOf:
                          - type: object
                            properties:
                              primary_text:
                                type: string
                              secondary_text:
                                anyOf:
                                  - type: string
                                  - type: 'null'
                            required:
                              - primary_text
                          - type: 'null'
                      created_at:
                        anyOf:
                          - type: number
                          - type: 'null'
                      entitlement_id:
                        anyOf:
                          - type: string
                          - type: 'null'
                      price_id:
                        anyOf:
                          - type: string
                          - type: 'null'
                      price_config:
                        anyOf:
                          - {}
                          - type: 'null'
                    required:
                      - interval
                free_trial:
                  anyOf:
                    - type: object
                      properties:
                        length:
                          anyOf:
                            - type: string
                            - type: number
                        unique_fingerprint:
                          default: false
                          type: boolean
                        duration:
                          default: day
                          type: string
                          enum:
                            - day
                            - month
                            - year
                        card_required:
                          default: true
                          type: boolean
                      required:
                        - length
                    - type: 'null'
              required:
                - id
                - name
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Autumn from '@useautumn/sdk';

            const client = new Autumn({
              secretKey: 'My Secret Key',
            });

            const product = await client.products.create({ id: 'id', name: 'name' });

            console.log(product.id);
        - lang: Python
          source: |-
            from autumn import Autumn

            client = Autumn(
                secret_key="My Secret Key",
            )
            product = client.products.create(
                id="id",
                name="name",
            )
            print(product.id)
