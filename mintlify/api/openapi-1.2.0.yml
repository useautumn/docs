openapi: 3.1.0
info:
  title: Autumn API
  version: 1.2.0
servers:
  - url: https://api.useautumn.com/v1
    description: Production server
security:
  - secretKey: []
paths:
  /products:
    get:
      summary: List Products
      tags:
        - products
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                required:
                  - list
                additionalProperties: false
    post:
      summary: Create Product
      tags:
        - products
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  pattern: ^[a-zA-Z0-9_-]+$
                  description: The ID of the product. Used to identify the product in other API
                    calls like checkout or update product.
                name:
                  type: string
                  description: The name of the product
                description:
                  description: The description of the product
                  anyOf:
                    - type: string
                    - type: "null"
                is_add_on:
                  default: false
                  description: Whether the product is an add-on. Add-on products can be attached
                    multiple times and don't to through upgrade / downgrade
                    flows.
                  type: boolean
                is_default:
                  default: false
                  description: Whether the product is the default product. Default products are
                    enabled by default for new customers.
                  type: boolean
                group:
                  description: Product group which this product belongs to. Products within a
                    group have upgrade / downgrade logic when the customer moves
                    between them.
                  anyOf:
                    - type: string
                    - type: "null"
                items:
                  description: Array of product items that define the product's features and
                    pricing
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        description: The type of the product item.
                        anyOf:
                          - type: string
                            enum:
                              - feature
                              - priced_feature
                              - price
                          - type: "null"
                      feature_id:
                        description: The feature ID of the product item. Should be null for fixed price
                          items.
                        anyOf:
                          - type: string
                          - type: "null"
                      included_usage:
                        description: The amount of usage included for this feature (per interval).
                        anyOf:
                          - anyOf:
                              - type: number
                              - type: string
                                const: inf
                          - type: "null"
                      interval:
                        description: The reset or billing interval of the product item. If null, feature
                          will have no reset date, and if there's a price, it
                          will be billed one-off.
                        anyOf:
                          - type: string
                            enum:
                              - minute
                              - hour
                              - day
                              - week
                              - month
                              - quarter
                              - semi_annual
                              - year
                          - type: "null"
                      interval_count:
                        description: Interval count of the feature.
                        anyOf:
                          - type: number
                          - type: "null"
                      entity_feature_id:
                        description: The feature ID of the entity (like seats) to track sub-balances
                          for.
                        anyOf:
                          - type: string
                          - type: "null"
                      usage_model:
                        description: Whether the feature should be prepaid upfront or billed for how
                          much they use end of billing period.
                        anyOf:
                          - type: string
                            enum:
                              - prepaid
                              - pay_per_use
                          - type: "null"
                      price:
                        description: The price of the product item. Should be null if tiered pricing is
                          set.
                        anyOf:
                          - type: number
                          - type: "null"
                      tiers:
                        description: Tiered pricing for the product item. Not applicable for fixed price
                          items.
                        anyOf:
                          - type: array
                            items:
                              type: object
                              properties:
                                to:
                                  anyOf:
                                    - type: number
                                    - type: string
                                      const: inf
                                  description: The maximum amount of usage for this tier.
                                  example: 100
                                amount:
                                  type: number
                                  description: The price of the product item for this tier.
                                  example: 10
                              required:
                                - to
                                - amount
                          - type: "null"
                      billing_units:
                        description: The billing units of the product item (eg $1 for 30 credits).
                        anyOf:
                          - type: number
                          - type: "null"
                      reset_usage_when_enabled:
                        description: Whether the usage should be reset when the product is enabled.
                        anyOf:
                          - type: boolean
                          - type: "null"
                    required:
                      - interval
                free_trial:
                  description: Free trial configuration for this product, if available
                  anyOf:
                    - $ref: "#/components/schemas/FreeTrialConfig"
                    - type: "null"
              required:
                - id
                - name
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{product_id}:
    get:
      summary: Get Product
      tags:
        - products
      parameters:
        - in: path
          name: product_id
          schema:
            type: string
          required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    post:
      summary: Update Product
      tags:
        - products
      parameters:
        - in: path
          name: product_id
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  description: The ID of the product. Used to identify the product in other API
                    calls like checkout or update product.
                  type: string
                  pattern: ^[a-zA-Z0-9_-]+$
                name:
                  description: The name of the product
                  type: string
                is_add_on:
                  description: Whether the product is an add-on. Add-on products can be attached
                    multiple times and don't to through upgrade / downgrade
                    flows.
                  type: boolean
                is_default:
                  description: Whether the product is the default product. Default products are
                    enabled by default for new customers.
                  type: boolean
                description:
                  description: The description of the product
                  anyOf:
                    - type: string
                    - type: "null"
                group:
                  description: Product group which this product belongs to. Products within a
                    group have upgrade / downgrade logic when the customer moves
                    between them.
                  anyOf:
                    - type: string
                    - type: "null"
                archived:
                  description: Archive this product using this flag. Archived products are hidden
                    on the dashboard.
                  type: boolean
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        description: The type of the product item.
                        anyOf:
                          - type: string
                            enum:
                              - feature
                              - priced_feature
                              - price
                          - type: "null"
                      feature_id:
                        description: The feature ID of the product item. Should be null for fixed price
                          items.
                        anyOf:
                          - type: string
                          - type: "null"
                      included_usage:
                        description: The amount of usage included for this feature (per interval).
                        anyOf:
                          - anyOf:
                              - type: number
                              - type: string
                                const: inf
                          - type: "null"
                      interval:
                        description: The reset or billing interval of the product item. If null, feature
                          will have no reset date, and if there's a price, it
                          will be billed one-off.
                        anyOf:
                          - type: string
                            enum:
                              - minute
                              - hour
                              - day
                              - week
                              - month
                              - quarter
                              - semi_annual
                              - year
                          - type: "null"
                      interval_count:
                        description: Interval count of the feature.
                        anyOf:
                          - type: number
                          - type: "null"
                      entity_feature_id:
                        description: The feature ID of the entity (like seats) to track sub-balances
                          for.
                        anyOf:
                          - type: string
                          - type: "null"
                      usage_model:
                        description: Whether the feature should be prepaid upfront or billed for how
                          much they use end of billing period.
                        anyOf:
                          - type: string
                            enum:
                              - prepaid
                              - pay_per_use
                          - type: "null"
                      price:
                        description: The price of the product item. Should be null if tiered pricing is
                          set.
                        anyOf:
                          - type: number
                          - type: "null"
                      tiers:
                        description: Tiered pricing for the product item. Not applicable for fixed price
                          items.
                        anyOf:
                          - type: array
                            items:
                              type: object
                              properties:
                                to:
                                  anyOf:
                                    - type: number
                                    - type: string
                                      const: inf
                                  description: The maximum amount of usage for this tier.
                                  example: 100
                                amount:
                                  type: number
                                  description: The price of the product item for this tier.
                                  example: 10
                              required:
                                - to
                                - amount
                          - type: "null"
                      billing_units:
                        description: The billing units of the product item (eg $1 for 30 credits).
                        anyOf:
                          - type: number
                          - type: "null"
                      reset_usage_when_enabled:
                        description: Whether the usage should be reset when the product is enabled.
                        anyOf:
                          - type: boolean
                          - type: "null"
                    required:
                      - interval
                free_trial:
                  description: Free trial configuration for this product, if available
                  anyOf:
                    - $ref: "#/components/schemas/FreeTrialConfig"
                    - type: "null"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      summary: Delete Product
      tags:
        - products
      parameters:
        - in: path
          name: product_id
          schema:
            type: string
          required: true
        - in: query
          name: all_versions
          schema:
            type: boolean
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
                additionalProperties: false
  /features:
    get:
      summary: List Features
      tags:
        - features
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: "#/components/schemas/Feature"
                required:
                  - list
                additionalProperties: false
    post:
      summary: Create Feature
      tags:
        - features
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  pattern: ^[a-zA-Z0-9_-]+$
                  description: The ID of the feature. This is used to refer to it in other API
                    calls like /track or /check.
                name:
                  description: The name of the feature.
                  anyOf:
                    - type: string
                    - type: "null"
                type:
                  type: string
                  enum:
                    - static
                    - boolean
                    - single_use
                    - continuous_use
                    - credit_system
                  description: The type of the feature. 'single_use' features are consumed, like
                    API calls, tokens, or messages. 'continuous_use' features
                    are allocated, like seats, workspaces, or projects.
                    'credit_system' features are schemas that unify multiple
                    'single_use' features into a single credit system.
                display:
                  description: Singular and plural display names for the feature in your user
                    interface.
                  anyOf:
                    - type: object
                      properties:
                        singular:
                          type: string
                        plural:
                          type: string
                      required:
                        - singular
                        - plural
                    - type: "null"
                credit_schema:
                  description: A schema that maps 'single_use' feature IDs to credit costs.
                    Applicable only for 'credit_system' features.
                  anyOf:
                    - type: array
                      items:
                        type: object
                        properties:
                          metered_feature_id:
                            type: string
                          credit_cost:
                            type: number
                        required:
                          - metered_feature_id
                          - credit_cost
                    - type: "null"
              required:
                - id
                - type
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
  /features/{feature_id}:
    get:
      summary: Get Feature
      tags:
        - features
      parameters:
        - in: path
          name: feature_id
          schema:
            type: string
          required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
    post:
      summary: Update Feature
      tags:
        - features
      parameters:
        - in: path
          name: feature_id
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  description: The ID of the feature. This is used to refer to it in other API
                    calls like /track or /check.
                  type: string
                  pattern: ^[a-zA-Z0-9_-]+$
                name:
                  description: The name of the feature.
                  type: string
                type:
                  description: The type of the feature. 'single_use' features are consumed, like
                    API calls, tokens, or messages. 'continuous_use' features
                    are allocated, like seats, workspaces, or projects.
                    'credit_system' features are schemas that unify multiple
                    'single_use' features into a single credit system.
                  type: string
                  enum:
                    - static
                    - boolean
                    - single_use
                    - continuous_use
                    - credit_system
                display:
                  description: Singular and plural display names for the feature in your user
                    interface.
                  type: object
                  properties:
                    singular:
                      type: string
                    plural:
                      type: string
                  required:
                    - singular
                    - plural
                credit_schema:
                  description: A schema that maps 'single_use' feature IDs to credit costs.
                    Applicable only for 'credit_system' features.
                  type: array
                  items:
                    type: object
                    properties:
                      metered_feature_id:
                        type: string
                      credit_cost:
                        type: number
                    required:
                      - metered_feature_id
                      - credit_cost
                archived:
                  description: Whether the feature is archived. Archived features are hidden from
                    the dashboard and list features endpoint.
                  type: boolean
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
    delete:
      summary: Delete Feature
      tags:
        - features
      parameters:
        - in: path
          name: feature_id
          schema:
            type: string
          required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
                additionalProperties: false
  /track:
    post:
      summary: Track Event
      tags:
        - core
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: string
                  description: ID which you provided when creating the customer
                feature_id:
                  description: ID of the feature to track usage for. Required if event_name is not
                    provided. Use this for direct feature tracking.
                  type: string
                event_name:
                  description: An [event name](/features/tracking-usage#using-event-names) can be
                    used in place of feature_id. This can be used if multiple
                    features are tracked in the same event.
                  type: string
                value:
                  description: The amount of usage to record. Defaults to 1. Can be negative to
                    increase the balance (e.g., when removing a seat).
                  type: number
                properties:
                  description: Additional properties to attach to this usage event.
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
                idempotency_key:
                  description: Unique key to prevent duplicate event recording. Use this to safely
                    retry requests without creating duplicate usage records.
                  type: string
                customer_data:
                  description: Additional customer properties. These will be used to create or
                    update the customer if they don't exist or their properties
                    are not already set.
                  $ref: "#/components/schemas/CustomerData"
                entity_id:
                  description: If using [entity balances](/features/feature-entities) (eg, seats),
                    the entity ID to track usage for.
                  type: string
                overage_behavior:
                  description: How to handle usage when balance is insufficient. 'cap' limits
                    usage to available balance, 'reject' prevents the usage
                    entirely.
                  type: string
                  enum:
                    - cap
                    - reject
              required:
                - customer_id
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_id:
                    type: string
                    description: The ID of the customer
                  entity_id:
                    description: The ID of the entity (if provided)
                    type: string
                  event_name:
                    description: The name of the event
                    type: string
                  feature_id:
                    description: The ID of the feature (if provided)
                    type: string
                required:
                  - customer_id
                additionalProperties: false
                example:
                  customer_id: customer_123
                  feature_id: api_tokens
      x-codeSamples:
        - lang: TypeScript
          source: |-
            import { Autumn } from 'autumn-js';

            const autumn = new Autumn();

            const { data, error } = await autumn.track({ customer_id: 'x' });
        - lang: Python
          source: >-
            import asyncio

            import os

            from autumn import Autumn


            client = Autumn(
                secret_key=os.environ.get("AUTUMN_SECRET_KEY"),  # This is the default and can be omitted
            )

            response = autumn.track(
                customer_id="x",
            )

            print(response.id)
  /check:
    post:
      summary: Check Feature Access
      tags:
        - core
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: string
                  description: ID which you provided when creating the customer
                feature_id:
                  type: string
                  description: ID of the feature to check access to. Required if product_id is not
                    provided.
                entity_id:
                  description: If using entity balances (eg, seats), the entity ID to check access
                    for.
                  type: string
                customer_data:
                  description: Properties used if customer is automatically created. Will also
                    update if the name or email is not already set.
                  $ref: "#/components/schemas/CustomerData"
                required_balance:
                  description: If you know the amount of the feature the end user is consuming in
                    advance. If their balance is below this quantity, allowed
                    will be false.
                  type: number
                send_event:
                  description: If true, a usage event will be recorded together with checking
                    access. The required_balance field will be used as the usage
                    value.
                  type: boolean
                with_preview:
                  description: If true, the response will include a preview object, which can be
                    used to display information such as a paywall or upgrade
                    confirmation.
                  type: boolean
              required:
                - customer_id
                - feature_id
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                    description: Whether the customer has access to the feature
                  code:
                    type: string
                    description: Code describing the result of the check
                  customer_id:
                    type: string
                    description: ID of the customer
                  feature_id:
                    type: string
                    description: ID of the feature
                  entity_id:
                    description: ID of the entity
                    anyOf:
                      - type: string
                      - type: "null"
                  required_balance:
                    description: Balance of the feature the customer is required to have.
                    type: number
                  interval:
                    description: The billing interval (e.g., 'month', 'year') or 'multiple' if the
                      feature has different intervals across subscriptions
                    anyOf:
                      - anyOf:
                          - type: string
                            enum:
                              - lifetime
                              - minute
                              - hour
                              - day
                              - week
                              - month
                              - quarter
                              - semi_annual
                              - year
                          - type: string
                            const: multiple
                      - type: "null"
                  interval_count:
                    description: The number of intervals between usage resets
                    anyOf:
                      - type: number
                      - type: "null"
                  unlimited:
                    description: Whether the feature has unlimited usage with no restrictions or
                      limits
                    anyOf:
                      - type: boolean
                      - type: "null"
                  balance:
                    description: The remaining available balance across all subscriptions for this
                      feature (or all time for allocated features)
                    anyOf:
                      - type: number
                      - type: "null"
                  usage:
                    description: The total cumulative usage consumed in the current cycle across all
                      subscriptions (or all time for allocated features)
                    anyOf:
                      - type: number
                      - type: "null"
                  included_usage:
                    description: The total amount of usage included in the customer's plan(s) for
                      this feature
                    anyOf:
                      - type: number
                      - type: "null"
                  next_reset_at:
                    description: Unix timestamp (in milliseconds) when the usage counter will reset
                      for the next cycle
                    anyOf:
                      - type: number
                      - type: "null"
                  overage_allowed:
                    description: Whether the customer can continue using the feature beyond the
                      included usage. If false, access is blocked when limit is
                      reached
                    anyOf:
                      - type: boolean
                      - type: "null"
                  breakdown:
                    description: Detailed breakdown by interval for features with multiple intervals
                    anyOf:
                      - type: array
                        items:
                          type: object
                          properties:
                            interval:
                              anyOf:
                                - type: string
                                  enum:
                                    - lifetime
                                    - minute
                                    - hour
                                    - day
                                    - week
                                    - month
                                    - quarter
                                    - semi_annual
                                    - year
                                - type: "null"
                              description: The reset interval for this feature breakdown
                            interval_count:
                              description: The number of intervals between usage resets
                              anyOf:
                                - type: number
                                - type: "null"
                            balance:
                              description: The remaining available balance for this interval. Only present for
                                metered features
                              anyOf:
                                - type: number
                                - type: "null"
                            usage:
                              description: The total amount of usage consumed in the current cycle
                              anyOf:
                                - type: number
                                - type: "null"
                            included_usage:
                              description: The amount of usage included in the customer's plan for this
                                interval
                              anyOf:
                                - type: number
                                - type: "null"
                            next_reset_at:
                              description: Unix timestamp (in milliseconds) when the usage counter will reset
                                for the next billing period
                              anyOf:
                                - type: number
                                - type: "null"
                            usage_limit:
                              description: The maximum usage allowed for this feature. null if unlimited or no
                                limit is set
                              anyOf:
                                - type: number
                                - type: "null"
                            overage_allowed:
                              description: Whether the customer can continue using the feature beyond the
                                usage limit. If false, access is blocked when
                                limit is reached
                              anyOf:
                                - type: boolean
                                - type: "null"
                          required:
                            - interval
                          additionalProperties: false
                      - type: "null"
                  usage_limit:
                    description: If this feature has a price, the usage limit indicates the maximum
                      amount of usage the customer can use of this feature.
                    anyOf:
                      - type: number
                      - type: "null"
                required:
                  - allowed
                  - code
                  - customer_id
                  - feature_id
                additionalProperties: false
                example:
                  allowed: true
                  code: feature_found
                  customer_id: customer_123
                  feature_id: api_tokens
                  required_balance: 5
                  interval: month
                  interval_count: 1
                  unlimited: false
                  balance: 350
                  usage: 150
                  included_usage: 500
                  next_reset_at: 1731507600000
                  overage_allowed: false
      x-codeSamples:
        - lang: TypeScript
          source: >-
            import { Autumn } from 'autumn-js';


            const autumn = new Autumn();


            const { data, error } = await autumn.check({ customer_id:
            'customer_id', feature_id: 'feature_id' });
        - lang: Python
          source: >-
            import asyncio

            import os

            from autumn import Autumn


            client = Autumn(
                secret_key=os.environ.get("AUTUMN_SECRET_KEY"),  # This is the default and can be omitted
            )

            response = autumn.check(
                customer_id="customer_id",
                feature_id="feature_id",
            )

            print(response.customer_id)
  /usage:
    post:
      summary: Set Usage
      description: Set usage for a feature. This is similar to /track instead of
        incrementing usage, it sets the usage value to exactly what is provided.
      tags:
        - core
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: string
                  description: The ID of the customer.
                feature_id:
                  type: string
                  description: The ID of the feature to set usage for.
                value:
                  type: number
                  description: The value you want to set this customer's usage of the feature to.
                entity_id:
                  description: The ID of the entity to set usage for.
                  type: string
                customer_data:
                  $ref: "#/components/schemas/CustomerData"
              required:
                - customer_id
                - feature_id
                - value
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
                additionalProperties: false
  /customers:
    get:
      summary: List Customers
      tags:
        - customers
      parameters:
        - in: query
