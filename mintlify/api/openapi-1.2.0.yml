  /events/list:
    post:
      summary: List Events
      tags:
        - events
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                offset:
                  default: 0
                  description: Number of items to skip
                  type: integer
                limit:
                  default: 100
                  description: Number of items to return. Default 100, max 1000.
                  type: integer
                customer_id:
                  type: string
                  description: Filter events by customer ID
                feature_id:
                  anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: Filter by specific feature ID(s)
                custom_range:
                  description: Filter events by time range
                  type: object
                  properties:
                    start:
                      description: Filter events after this timestamp (epoch milliseconds)
                      type: number
                    end:
                      description: Filter events before this timestamp (epoch milliseconds)
                      type: number
              required:
                - customer_id
                - feature_id
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Event ID (KSUID)
                        timestamp:
                          type: number
                          description: Event timestamp (epoch milliseconds)
                        feature_id:
                          type: string
                          description: ID of the feature that the event belongs to
                        customer_id:
                          type: string
                          description: Customer identifier
                        value:
                          type: number
                          description: Event value/count
                        properties:
                          type: object
                          properties: {}
                          additionalProperties: false
                          description: Event properties (JSONB)
                      required:
                        - id
                        - timestamp
                        - feature_id
                        - customer_id
                        - value
                        - properties
                      additionalProperties: false
                    description: Array of items for current page
                  has_more:
                    type: boolean
                    description: Whether more results exist after this page
                  offset:
                    type: number
                    description: Current offset position
                  limit:
                    type: number
                    description: Limit passed in the request
                  total:
                    type: number
                    description: Total number of items returned in the current page
                required:
                  - list
                  - has_more
                  - offset
                  - limit
                  - total
                additionalProperties: false
                example:
                  list:
                    - id: evt_36xpk2TmuQX5zVPPQ8tCtnR5Weg
                      timestamp: 1765958215459
                      feature_id: credits
                      customer_id: 0pCIbS4AMAFDB1iBMNhARWZt2gDtVwQx
                      value: 30
                      properties: {}
                    - id: evt_36xmHxxjAkqxufDf9yHAPNfRrLM
                      timestamp: 1765956512057
                      feature_id: credits
                      customer_id: 0pCIbS4AMAFDB1iBMNhARWZt2gDtVwQx
                      value: 49
                      properties: {}
                  total: 2
                  has_more: false
                  offset: 0
                  limit: 100
      x-codeSamples:
