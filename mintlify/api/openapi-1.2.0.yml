components:
  schemas:
    QueryParams:
      description: Parameters for querying analytics data
      type: object
      properties:
        customer_id:
          description: The ID of the customer to query analytics for
          example: cus_123
          type: string
        feature_id:
          description: The feature ID(s) to query
          example: api_calls
          anyOf:
            - type: string
            - type: array
              items:
                type: string
        range:
          description: Time range for the query (defaults to last_cycle if not provided)
          example: 7d
          anyOf:
            - type: string
              enum:
                - 24h
                - 7d
                - 30d
                - 90d
                - last_cycle
            - type: 'null'
      required:
        - customer_id
        - feature_id
    SetupPaymentParams:
      description: Parameters for setting up a payment method
      type: object
      properties:
        customer_id:
          description: The ID of the customer
          example: cus_123
          type: string
        success_url:
          description: URL to redirect to after successful payment setup
          example: https://example.com/success
          type: string
        checkout_session_params:
          description: Additional parameters for the checkout session
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
      required:
        - customer_id
    CustomerProduct:
      description: Customer product object returned by the API
      type: object
      properties:
        id:
          description: The unique identifier for the product
          example: pro_plan
          type: string
        name:
          description: The name of the product
          example: Pro Plan
          anyOf:
            - type: string
            - type: 'null'
        group:
          description: The group the product belongs to
          example: product_set_1
          anyOf:
            - type: string
            - type: 'null'
        status:
          description: Current status of the product for this customer
          example: active
          type: string
          enum:
            - active
            - expired
            - scheduled
            - trialing
            - past_due
        canceled_at:
          description: Timestamp when the product was canceled for the customer
          example: 1717000000
          anyOf:
            - type: number
            - type: 'null'
        started_at:
          description: Timestamp when the customer started this product
          example: 1700000000000
          type: number
        is_default:
          description: Whether this product is the default for the customer
          example: true
          type: boolean
        is_add_on:
          description: Whether the product is an add-on
          example: false
          type: boolean
        version:
          description: Version of the product
          example: 1
          anyOf:
            - type: number
            - type: 'null'
        stripe_subscription_ids:
          description: List of Stripe subscription IDs associated with this product, if any
          example:
            - sub_1Nc0JzBAbcxyz
            - sub_1Nc0xyBAnopq
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
        current_period_start:
          description: Start of the current billing period
          example: 1717000000
          anyOf:
            - type: number
            - type: 'null'
        current_period_end:
          description: End of the current billing period
          example: 1719600000
          anyOf:
            - type: number
            - type: 'null'
        entity_id:
          description: ID of the entity this customer product is attached to, if applicable
          example: entity_1234abcd
          anyOf:
            - type: string
            - type: 'null'
        items:
          description: Array of product items defining the features and pricing
          example:
            - feature_id: <string>
              feature_type: single_use
              included_usage: 123
              interval: month
              usage_model: prepaid
              price: 123
              billing_units: 1000
              entity_feature_id: <string>
              reset_usage_when_enabled: true
              tiers:
                - to: 100
                  amount: 10
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/ProductItem'
            - type: 'null'
        quantity:
          description: The number of units of this product held by the customer, if applicable
          example: 1
          type: number
      required:
        - id
        - name
        - group
        - status
        - started_at
        - is_default
        - is_add_on
    ProductItem:
      description: Product item defining features and pricing within a product
      type: object
      properties:
        type:
          description: The type of the product item
          example: <string>
          anyOf:
            - type: string
              enum:
                - feature
                - priced_feature
                - price
            - type: 'null'
        feature_id:
          description: The feature ID of the product item. Should be `null` for prices.
          example: <string>
          anyOf:
            - type: string
            - type: 'null'
        feature_type:
          description: >-
            Single use features are used once and then depleted, like API calls or credits. Continuous use
            features are those being used on an ongoing-basis, like storage or seats.
          example: <string>
          anyOf:
            - type: string
              enum:
                - single_use
                - continuous_use
                - boolean
                - static
            - type: 'null'
        feature:
          description: The feature itself
          example:
            id: <string>
            name: <string>
          anyOf:
            - type: object
              properties:
                id:
                  description: The unique identifier of the feature
                  example: <string>
                  type: string
                name:
                  description: The name of the feature
                  example: <string>
                  anyOf:
                    - type: string
                    - type: 'null'
                type:
                  description: The type of the feature
                  example: <string>
                  type: string
                  enum:
                    - static
                    - boolean
                    - single_use
                    - continuous_use
                    - credit_system
                display:
                  description: Display names for the feature
                  example:
                    singular: <string>
                    plural: <string>
                  anyOf:
                    - type: object
                      properties:
                        singular:
                          type: string
                        plural:
                          type: string
                      required:
                        - singular
                        - plural
                    - type: 'null'
                credit_schema:
                  description: Credit cost schema for credit system features
                  example:
                    - metered_feature_id: <string>
                      credit_cost: 123
                  anyOf:
                    - type: array
                      items:
                        type: object
                        properties:
                          metered_feature_id:
                            type: string
                          credit_cost:
                            type: number
                        required:
                          - metered_feature_id
                          - credit_cost
                    - type: 'null'
                archived:
                  description: Whether or not the feature is archived
                  example: false
                  anyOf:
                    - type: boolean
                    - type: 'null'
              required:
                - id
                - type
            - type: 'null'
        included_usage:
          description: The amount of usage included for this feature.
          example: 123
          anyOf:
            - anyOf:
                - type: number
                - type: string
                  const: inf
            - type: 'null'
        interval:
          description: >-
            The reset or billing interval of the product item. If null, feature will have no reset date, and
            if there's a price, it will be billed one-off.
          example: <string>
          anyOf:
            - type: string
              enum:
                - minute
                - hour
                - day
                - week
                - month
                - quarter
                - semi_annual
                - year
            - type: 'null'
        interval_count:
          description: The number of intervals between resets
          example: 123
          anyOf:
            - type: number
            - type: 'null'
        price:
          description: The price of the product item. Should be `null` if tiered pricing is set.
          example: 123
          anyOf:
            - type: number
            - type: 'null'
        tiers:
          description: Tiered pricing for the product item.
          example:
            - to: 100
              amount: 10
            - to: 200
              amount: 20
          anyOf:
            - type: array
              items:
                type: object
                properties:
                  to:
                    description: The maximum amount of usage for this tier.
                    example: 100
                    anyOf:
                      - type: number
                      - type: string
                        const: inf
                  amount:
                    description: The price of the product item for this tier.
                    example: 10
                    type: number
                required:
                  - to
                  - amount
            - type: 'null'
        usage_model:
          description: >-
            Whether the feature should be prepaid upfront or billed for how much they use end of billing
            period.
          example: <string>
          anyOf:
            - type: string
              enum:
                - prepaid
                - pay_per_use
            - type: 'null'
        billing_units:
          description: The amount per billing unit (eg. $9 / 250 units)
          example: 250
          anyOf:
            - type: number
            - type: 'null'
        reset_usage_when_enabled:
          description: Whether the usage should be reset when the product is enabled.
          anyOf:
            - type: boolean
            - type: 'null'
        quantity:
          anyOf:
            - type: number
            - type: 'null'
        next_cycle_quantity:
          anyOf:
            - type: number
            - type: 'null'
        entity_feature_id:
          description: The entity feature ID of the product item if applicable.
          example: <string>
          anyOf:
            - type: string
            - type: 'null'
        display:
          description: The display of the product item.
          example:
            primary_text: <string>
            secondary_text: <string>
          anyOf:
            - type: object
              properties:
                primary_text:
                  type: string
                secondary_text:
                  anyOf:
                    - type: string
                    - type: 'null'
              required:
                - primary_text
            - type: 'null'
    QueryResult:
      description: Result of an analytics query
      type: object
      properties:
        list:
          description: List of usage data points
          example:
            - period: 1717000000000
              count: 100
          type: array
          items: {}
      required:
        - list
      additionalProperties: false
    SetupPaymentResult:
      description: Result of setting up a payment method
      type: object
      properties:
        customer_id:
          description: The ID of the customer
          example: cus_123
          type: string
        url:
          description: URL to the payment setup page
          example: https://checkout.stripe.com/...
          type: string
      required:
        - customer_id
        - url
      additionalProperties: false
    ReferralCode:
      description: Referral code object returned by the API
      type: object
      properties:
        code:
          description: The referral code that can be shared with customers
          example: REF123ABC
          type: string
        customer_id:
          description: Your unique identifier for the customer
          example: cus_123
          type: string
        created_at:
          description: The timestamp of when the referral code was created
          example: 1717000000
          type: number
      required:
        - code
        - customer_id
        - created_at
      additionalProperties: false
    RedeemReferralCodeResponse:
      description: Redemption response object returned by the API
      type: object
      properties:
        id:
          description: The ID of the redemption event
          example: red_123
          type: string
        customer_id:
          description: Your unique identifier for the customer
          example: cus_456
          type: string
        reward_id:
          description: The ID of the reward that will be granted
          example: reward_789
          type: string
      required:
        - id
        - customer_id
        - reward_id
      additionalProperties: false
    Customer:
      description: Customer object returned by the API
      type: object
      properties:
        id:
          description: Your internal ID for the customer
          example: cus_123
          anyOf:
            - type: string
            - type: 'null'
        created_at:
          description: Timestamp of customer creation in milliseconds since epoch
          example: 1717000000
          type: number
        name:
          description: Customer’s name
          example: John Doe
          anyOf:
            - type: string
            - type: 'null'
        email:
          description: Customer’s email address
          example: john@doe.com
          anyOf:
            - type: string
            - type: 'null'
        fingerprint:
          description: Unique identifier (eg. serial number) to detect duplicate customers and prevent key leaks
          example: fp_9184And92839123hda
          anyOf:
            - type: string
            - type: 'null'
        stripe_id:
          description: Stripe customer ID
          example: cus_J8A5c31A8tlpwN
          default: null
          anyOf:
            - type: string
            - type: 'null'
        env:
          description: Environment the customer is in
          example: production
          type: string
          enum:
            - sandbox
            - live
        metadata:
          default: {}
          type: object
          propertyNames: {}
          additionalProperties: {}
        products:
          description: List of products the customer has access to
          example: []
          type: array
          items:
            $ref: '#/components/schemas/CustomerProductOutput'
        features:
          description: List of features the customer has access to
          example: {}
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: object
            properties:
              id:
                description: The unique identifier of the feature
                example: feature_123
                type: string
              type:
                description: The type of the feature
                example: single_use
                type: string
                enum:
                  - static
                  - boolean
                  - single_use
                  - continuous_use
                  - credit_system
              name:
                description: The name of the feature
                example: API Calls
                anyOf:
                  - type: string
                  - type: 'null'
              interval:
                description: The billing interval or 'multiple' if the feature has multiple intervals
                example: month
                anyOf:
                  - anyOf:
                      - type: string
                        enum:
                          - lifetime
                          - minute
                          - hour
                          - day
                          - week
                          - month
                          - quarter
                          - semi_annual
                          - year
                      - type: string
                        const: multiple
                  - type: 'null'
              interval_count:
                description: The number of intervals between resets
                example: 1
                anyOf:
                  - type: number
                  - type: 'null'
              unlimited:
                description: Whether the feature has unlimited usage
                example: false
                anyOf:
                  - type: boolean
                  - type: 'null'
              balance:
                description: The remaining balance for this feature
                example: 500
                anyOf:
                  - type: number
                  - type: 'null'
              usage:
                description: The current usage amount
                example: 250
                anyOf:
                  - type: number
                  - type: 'null'
              included_usage:
                description: The amount of usage included
                example: 1000
                anyOf:
                  - type: number
                  - type: 'null'
              next_reset_at:
                description: Timestamp when the usage resets
                example: 1759247877000
                anyOf:
                  - type: number
                  - type: 'null'
              overage_allowed:
                description: Whether overage usage beyond the limit is allowed
                example: true
                anyOf:
                  - type: boolean
                  - type: 'null'
              breakdown:
                description: Detailed breakdown by interval for features with multiple intervals
                example:
                  - interval: month
                    interval_count: 1
                    balance: 500
                    usage: 250
                anyOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        interval:
                          description: The billing interval for this feature breakdown
                          example: month
                          type: string
                          enum:
                            - lifetime
                            - minute
                            - hour
                            - day
                            - week
                            - month
                            - quarter
                            - semi_annual
                            - year
                        interval_count:
                          description: The number of intervals between resets
                          example: 1
                          anyOf:
                            - type: number
                            - type: 'null'
                        balance:
                          description: The remaining balance for this interval
                          example: 500
                          anyOf:
                            - type: number
                            - type: 'null'
                        usage:
                          description: The current usage amount
                          example: 250
                          anyOf:
                            - type: number
                            - type: 'null'
                        included_usage:
                          description: The amount of usage included in this interval
                          example: 1000
                          anyOf:
                            - type: number
                            - type: 'null'
                        next_reset_at:
                          description: Timestamp when the usage resets
                          example: 1759247877000
                          anyOf:
                            - type: number
                            - type: 'null'
                        usage_limit:
                          description: The maximum usage allowed
                          example: 1000
                          anyOf:
                            - type: number
                            - type: 'null'
                        rollovers:
                          description: Array of rollover balances from previous periods
                          example:
                            - balance: 100
                              expires_at: 1759247877000
                          anyOf:
                            - type: array
                              items:
                                type: object
                                properties:
                                  balance:
                                    description: The remaining balance amount that has rolled over
                                    example: 100
                                    type: number
                                  expires_at:
                                    description: Timestamp when the rollover balance expires
                                    example: 1759247877000
                                    type: number
                                required:
                                  - balance
                                  - expires_at
                                additionalProperties: false
                            - type: 'null'
                      required:
                        - interval
                      additionalProperties: false
                  - type: 'null'
              credit_schema:
                description: Credit conversion schema for credit system features
                example:
                  - feature_id: feature_123
                    credit_amount: 10
                anyOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        feature_id:
                          description: The ID of the feature that credits are applied to
                          example: feature_123
                          type: string
                        credit_amount:
                          description: The amount of credits applied per usage
                          example: 10
                          type: number
                      required:
                        - feature_id
                        - credit_amount
                      additionalProperties: false
                  - type: 'null'
              usage_limit:
                description: The maximum usage allowed
                example: 1000
                anyOf:
                  - type: number
                  - type: 'null'
              rollovers:
                description: Array of rollover balances from previous periods
                example:
                  - balance: 100
                    expires_at: 1759247877000
                anyOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        balance:
                          description: The remaining balance amount that has rolled over
                          example: 100
                          type: number
                        expires_at:
                          description: Timestamp when the rollover balance expires
                          example: 1759247877000
                          type: number
                      required:
                        - balance
                        - expires_at
                      additionalProperties: false
                  - type: 'null'
            required:
              - id
              - type
            additionalProperties: false
        invoices:
          type: array
          items:
            type: object
            properties:
              product_ids:
                description: Array of product IDs included in this invoice
                example:
                  - pro_plan
                  - addon_feature
                type: array
                items:
                  type: string
              stripe_id:
                description: The Stripe invoice ID
                example: in_1A2B3C4D5E6F7G8H
                type: string
              status:
                description: The status of the invoice
                example: paid
                type: string
              total:
