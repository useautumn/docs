  /attach:
    post:
      summary: Attach Product
      description: >-
        Enables a product for a customer and processes payment if their payment method is already on file.


        Use this when the customer already has a payment method saved. For new customers without payment info,
        use `checkout` instead.


        @example

        ```typescript

        // Attach a product to a customer

        const response = await client.attach({
            "customer_id": "cus_123",
            "product_id": "pro_plan"
          });
        ```


        @param body.customer_id - Your unique identifier for the customer

        @param body.product_id - Product ID, set when creating the product in the Autumn dashboard

        @param body.entity_id - If attaching a product to an entity, can be used to auto create the entity

        @param body.customer_data - If auto creating a customer, the properties from this field will be used.

        @param body.entity_data - If attaching a product to an entity and auto creating the entity, the
        properties from this field will be used. feature_id is required.

        @param body.product_ids - Can be used to attach multiple products to the customer at once. For
        example, attaching a main product and an add-on.

        @param body.options - Pass in quantities for prepaid features

        @param body.free_trial - If the product has a free trial, this field can be used to disable it when
        attaching (by passing in false)

        @param body.success_url - URL to redirect to after the purchase is successful

        @param body.force_checkout - Always return a Stripe Checkout URL, even if the customer's card is
        already on file

        @param body.checkout_session_params - Additional parameters to pass onto Stripe when creating the
        checkout session

        @param body.reward - An Autumn promo_code or reward_id to apply at checkout


        @see {@link https://docs.useautumn.com/api-reference/core/attach Product Attachments}
      tags:
        - core
      requestBody:
        content:
          application/json:
            schema:
              example:
                customer_id: cus_123
                product_id: pro
              type: object
              properties:
                customer_id:
                  description: Your unique identifier for the customer
                  type: string
                product_id:
                  description: Product ID, set when creating the product in the Autumn dashboard
                  anyOf:
                    - type: string
                    - type: 'null'
                entity_id:
                  description: If attaching a product to an entity, can be used to auto create the entity
                  anyOf:
                    - type: string
                    - type: 'null'
                customer_data:
                  description: If auto creating a customer, the properties from this field will be used.
                  type: object
                  properties:
                    name:
                      description: Customer's name
                      example: John Doe
                      anyOf:
                        - type: string
                        - type: 'null'
                    email:
                      description: Customer's email address
                      example: john@example.com
                      anyOf:
                        - type: string
                        - type: 'null'
                    fingerprint:
                      description: >-
                        Unique identifier (eg, serial number) to detect duplicate customers and prevent free
                        trial abuse
                      example: fp_123abc
                      anyOf:
                        - type: string
                        - type: 'null'
                    metadata:
                      description: Additional metadata for the customer
                      example:
                        company: Acme Inc
                      anyOf:
                        - type: object
                          propertyNames: {}
                          additionalProperties: {}
                        - type: 'null'
                    stripe_id:
                      description: Stripe customer ID if you already have one
                      example: cus_stripe123
                      anyOf:
                        - type: string
                        - type: 'null'
                entity_data:
                  description: >-
                    If attaching a product to an entity and auto creating the entity, the properties from this
                    field will be used. feature_id is required.
                  type: object
                  properties:
                    feature_id:
                      description: The feature ID that this entity is associated with
                      example: seats
                      type: string
                    name:
                      description: Name of the entity
                      example: Team Alpha
                      type: string
                  required:
                    - feature_id
                product_ids:
                  description: >-
                    Can be used to attach multiple products to the customer at once. For example, attaching a
                    main product and an add-on.
                  anyOf:
                    - minItems: 1
                      type: array
                      items:
                        type: string
                    - type: 'null'
                options:
                  description: Pass in quantities for prepaid features
                  anyOf:
                    - type: array
                      items:
                        type: object
                        properties:
                          feature_id:
                            type: string
                          quantity:
                            type: number
                          upcoming_quantity:
                            anyOf:
                              - type: number
                              - type: 'null'
                          adjustable_quantity:
                            anyOf:
                              - type: boolean
                              - type: 'null'
                          internal_feature_id:
                            anyOf:
                              - type: string
                              - type: 'null'
                        required:
                          - feature_id
                          - quantity
                    - type: 'null'
                free_trial:
                  description: >-
                    If the product has a free trial, this field can be used to disable it when attaching (by
                    passing in false)
                  type: boolean
                success_url:
                  description: URL to redirect to after the purchase is successful
                  type: string
                force_checkout:
                  description: Always return a Stripe Checkout URL, even if the customer's card is already on file
                  type: boolean
                checkout_session_params:
                  description: Additional parameters to pass onto Stripe when creating the checkout session
                reward:
                  description: An Autumn promo_code or reward_id to apply at checkout
                  anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                invoice:
                  type: boolean
                setup_payment:
                  type: boolean
              required:
                - customer_id
            examples:
              basic:
                summary: Attach a product immediately
                description: Enable a product for a customer with immediate activation
                value:
                  customer_id: cus_123
                  product_id: pro_plan
      responses:
        '200':
          description: Product attached successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_id:
                    type: string
                  product_ids:
                    type: array
                    items:
                      type: string
                  code:
                    type: string
                  message:
                    type: string
                  checkout_url:
                    anyOf:
                      - type: string
                      - type: 'null'
                  invoice:
                    anyOf:
                      - {}
                      - type: 'null'
                required:
                  - customer_id
                  - product_ids
                  - code
                  - message
                additionalProperties: false
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Autumn from '@useautumn/sdk';

            const client = new Autumn({
              secretKey: 'My Secret Key',
            });

            const response = await client.attach({ customer_id: 'cus_123', product_id: 'pro_plan' });

            console.log(response.customer_id);
        - lang: Python
          source: |-
            from autumn import Autumn

            client = Autumn(
                secret_key="My Secret Key",
            )
            response = client.attach(
                customer_id="cus_123",
                product_id="pro_plan",
            )
            print(response.customer_id)
  /checkout:
    post:
      summary: Checkout
      description: >-
        Creates a checkout session for a customer to purchase a product with payment collection.


        Use this for new customers or when payment info is needed. For customers with existing payment
        methods, use `attach` instead.


        @example

        ```typescript

        // Create a checkout session

        const response = await client.checkout({
            "customer_id": "cus_123",
            "product_id": "pro_plan"
          });
        ```


        @param body.customer_id - Your unique identifier for the customer

        @param body.product_id - Product ID, set when creating the product in the Autumn dashboard

        @param body.entity_id - If attaching a product to an entity, can be used to auto create the entity

        @param body.customer_data - If auto creating a customer, the properties from this field will be used.

