  /customers/{customer_id}/balances:
    post:
      summary: Set Feature Balances
      description: Set the balance of a feature for a specific customer
      tags:
        - customers
      parameters:
        - in: path
          name: customer_id
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              example:
                balances:
                  - feature_id: tokens
                    balance: 1000
              type: object
              properties:
                balances:
                  type: array
                  items:
                    type: object
                    properties:
                      feature_id:
                        description: The ID of the feature to update balance for.
                        type: string
                      balance:
                        description: The new balance value.
                        type: number
                    required:
                      - feature_id
                      - balance
              required:
                - balances
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
                additionalProperties: false
      x-codeSamples:
        - lang: TypeScript
          source: >-
            import { Autumn } from 'autumn-js';


            const autumn = new Autumn();


            const response = await
            autumn.customers.updateBalances('customer_id', {
              balances: [{ balance: 1000, feature_id: 'tokens' }],
            });


            console.log(response.success);
        - lang: Python
          source: |-
            import asyncio
            from autumn import Autumn

            autumn = Autumn("am_sk_1234567890")

            async def main():
                response = await autumn.customers.update_balances(
                    customer_id="customer_id",
                    balances=[{
                        "balance": 1000,
                        "feature_id": "tokens",
                    }],
                )
                print(response.success)

            asyncio.run(main())
  /usage:
    post:
      summary: Set Usage
      description: Set usage for a feature. This is similar to /track instead of
        incrementing usage, it sets the usage value to exactly what is provided.
      tags:
        - core
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  description: The ID of the customer.
                  type: string
                feature_id:
                  description: The ID of the feature to set usage for.
                  type: string
                value:
                  description: The value you want to set this customer's usage of the feature to.
                  type: number
                entity_id:
                  description: The ID of the entity to set usage for.
                  type: string
                customer_data:
                  $ref: "#/components/schemas/CustomerData"
              required:
                - customer_id
                - feature_id
                - value
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
                additionalProperties: false
      x-codeSamples:
        - lang: TypeScript
          source: >-
            import { Autumn } from 'autumn-js';


            const autumn = new Autumn();


            const response = await autumn.usage({ customer_id: 'x', feature_id:
            'feature_id', value: 0 });


            console.log(response.success);
        - lang: Python
          source: |-
            import asyncio
            from autumn import Autumn

            autumn = Autumn("am_sk_1234567890")

            async def main():
                response = await autumn.usage(
                    customer_id="x",
                    feature_id="feature_id",
                    value=0,
                )
                print(response.success)

            asyncio.run(main())
components:
  schemas:
    CreateProductItemParams:
      description: Product item defining features and pricing within a product
      type: object
      properties:
        feature_id:
          description: The feature ID of the product item. Should be null for fixed price
            items.
          anyOf:
            - type: string
            - type: "null"
        included_usage:
          description: The amount of usage included for this feature (per interval).
          anyOf:
            - anyOf:
                - type: number
                - type: string
                  const: inf
            - type: "null"
        interval:
          description: The reset or billing interval of the product item. If null, feature
            will have no reset date, and if there's a price, it will be billed
            one-off.
          anyOf:
            - type: string
              enum:
                - minute
                - hour
                - day
                - week
                - month
                - quarter
                - semi_annual
                - year
            - type: "null"
        interval_count:
          description: Interval count of the feature.
          anyOf:
            - type: number
            - type: "null"
        entity_feature_id:
          description: The feature ID of the entity (like seats) to track sub-balances for.
          anyOf:
            - type: string
            - type: "null"
        usage_model:
          description: Whether the feature should be prepaid upfront or billed for how
            much they use end of billing period.
          anyOf:
            - type: string
              enum:
                - prepaid
                - pay_per_use
            - type: "null"
        price:
          description: The price of the product item. Should be null if tiered pricing is
            set.
          anyOf:
            - type: number
            - type: "null"
        tiers:
          description: Tiered pricing for the product item. Not applicable for fixed price
            items.
          anyOf:
            - type: array
              items:
                type: object
                properties:
                  to:
                    description: The maximum amount of usage for this tier.
                    example: 100
                    anyOf:
                      - type: number
                      - type: string
                        const: inf
                  amount:
                    description: The price of the product item for this tier.
                    example: 10
                    type: number
                required:
                  - to
                  - amount
            - type: "null"
        billing_units:
          description: The billing units of the product item (eg $1 for 30 credits).
          anyOf:
            - type: number
            - type: "null"
        reset_usage_when_enabled:
          description: Whether the usage should be reset when the product is enabled.
          anyOf:
            - type: boolean
            - type: "null"
      required:
        - interval
    CustomerData:
      description: Used to add customer details like name or email when auto-creating
        a customer.
      type: object
      properties:
        name:
          description: Customer's name
          anyOf:
            - type: string
            - type: "null"
        email:
          description: Customer's email address
          anyOf:
            - type: string
            - type: "null"
        fingerprint:
          description: Unique identifier (eg, serial number) to detect duplicate customers
            and prevent free trial abuse
          anyOf:
            - type: string
            - type: "null"
        metadata:
          description: Additional metadata for the customer
          anyOf:
            - type: object
              propertyNames: {}
              additionalProperties: {}
            - type: "null"
        stripe_id:
          description: Stripe customer ID if you already have one
          anyOf:
            - type: string
            - type: "null"
    CustomerProduct:
      description: Customer product object returned by the API
      type: object
      properties:
        id:
          description: The unique identifier for the product
          example: pro_plan
          type: string
        name:
          description: The name of the product
          example: Pro Plan
          anyOf:
            - type: string
            - type: "null"
        group:
          description: The group the product belongs to
          example: product_set_1
          anyOf:
            - type: string
            - type: "null"
        status:
          description: Current status of the product for this customer
          example: active
          type: string
          enum:
            - active
            - expired
            - scheduled
            - trialing
            - past_due
        canceled_at:
          description: Timestamp when the product was canceled for the customer
          example: 1717000000
          anyOf:
            - type: number
            - type: "null"
        started_at:
          description: Timestamp when the customer started this product
          example: 1700000000000
          type: number
        is_default:
          description: Whether this product is the default for the customer
          example: true
          type: boolean
        is_add_on:
          description: Whether the product is an add-on
          example: false
          type: boolean
        version:
          description: Version of the product
          example: 1
          anyOf:
            - type: number
            - type: "null"
        stripe_subscription_ids:
          description: List of Stripe subscription IDs associated with this product, if any
          example:
            - sub_1Nc0JzBAbcxyz
            - sub_1Nc0xyBAnopq
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
        current_period_start:
          description: Start of the current billing period
          example: 1717000000
          anyOf:
            - type: number
            - type: "null"
        current_period_end:
          description: End of the current billing period
          example: 1719600000
          anyOf:
            - type: number
            - type: "null"
        entity_id:
          description: ID of the entity this customer product is attached to, if applicable
          example: entity_1234abcd
          anyOf:
            - type: string
            - type: "null"
        items:
          description: Array of product items defining the features and pricing
          example:
            - feature_id: <string>
              feature_type: single_use
              included_usage: 123
              interval: month
              usage_model: prepaid
              price: 123
              billing_units: 1000
              entity_feature_id: <string>
              reset_usage_when_enabled: true
              tiers:
                - to: 100
                  amount: 10
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/ProductItem"
            - type: "null"
        quantity:
          description: The number of units of this product held by the customer, if
            applicable
          example: 1
          type: number
      required:
