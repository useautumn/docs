    EventAggregateResponseGrouped:
      allOf:
        - type: object
          properties:
            list:
              type: array
              items:
                type: object
                properties:
                  period:
                    type: number
                required:
                  - period
                additionalProperties:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: number
          required:
            - list
          additionalProperties: false
        - type: object
          properties:
            total:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                type: object
                properties:
                  count:
                    type: number
                  sum:
                    type: number
                required:
                  - count
                  - sum
                additionalProperties: false
          required:
            - total
          additionalProperties: false
      title: With Group
      description: Response when group_by is provided. Feature values are objects with
        group values as keys.
    Customer:
