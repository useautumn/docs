          anyOf:
            - type: array
              items:
                type: object
                properties:
                  to:
                    description: The maximum amount of usage for this tier.
                    example: 100
                    anyOf:
                      - type: number
                      - type: string
                        const: inf
                  amount:
                    description: The price of the product item for this tier.
                    example: 10
                    type: number
                required:
