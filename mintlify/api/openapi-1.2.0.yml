components:
  schemas:
    FreeTrialConfig:
      type: object
      properties:
        length:
          anyOf:
            - type: string
            - type: number
        unique_fingerprint:
          default: false
          type: boolean
        duration:
          default: day
          type: string
          enum:
            - day
            - month
            - year
        card_required:
          default: true
          type: boolean
      required:
        - length
      title: FreeTrialConfig
    CustomerData:
      type: object
      properties:
        name:
          description: Customer's name
          anyOf:
            - type: string
            - type: "null"
        email:
          description: Customer's email address
          anyOf:
            - type: string
            - type: "null"
      description: Customer details to set when creating a customer
    CustomerProduct:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the product
          example: pro_plan
        name:
          anyOf:
            - type: string
            - type: "null"
          description: The name of the product
          example: Pro Plan
        group:
          anyOf:
            - type: string
            - type: "null"
          description: The group the product belongs to
          example: product_set_1
        status:
          type: string
          enum:
            - active
            - expired
            - scheduled
            - trialing
            - past_due
          description: Current status of the product for this customer
          example: active
        canceled_at:
          description: Timestamp when the product was canceled for the customer
          example: 1717000000
          anyOf:
            - type: number
            - type: "null"
        started_at:
          type: number
          description: Timestamp when the customer started this product
          example: 1700000000000
        is_default:
          type: boolean
          description: Whether this product is the default for the customer
          example: true
        is_add_on:
          type: boolean
          description: Whether the product is an add-on
          example: false
        version:
          description: Version of the product
          example: 1
          anyOf:
            - type: number
            - type: "null"
        stripe_subscription_ids:
          description: List of Stripe subscription IDs associated with this product, if any
          example:
            - sub_1Nc0JzBAbcxyz
            - sub_1Nc0xyBAnopq
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
        current_period_start:
          description: Start of the current billing period
          example: 1717000000
          anyOf:
            - type: number
            - type: "null"
        current_period_end:
          description: End of the current billing period
          example: 1719600000
          anyOf:
            - type: number
            - type: "null"
        entity_id:
          description: ID of the entity this customer product is attached to, if applicable
          example: entity_1234abcd
          anyOf:
            - type: string
            - type: "null"
        items:
          description: Array of product items defining the features and pricing
          example:
            - feature_id: <string>
              feature_type: single_use
              included_usage: 123
              interval: month
              usage_model: prepaid
              price: 123
              billing_units: 1000
              entity_feature_id: <string>
              reset_usage_when_enabled: true
              tiers:
                - to: 100
                  amount: 10
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/ProductItem"
            - type: "null"
        quantity:
          description: The number of units of this product held by the customer, if
            applicable
          example: 1
          type: number
      required:
        - id
        - name
        - group
        - status
        - started_at
        - is_default
        - is_add_on
    ProductItem:
      type: object
      properties:
        type:
          description: The type of the product item
          anyOf:
            - type: string
              enum:
                - feature
                - priced_feature
                - price
            - type: "null"
        feature_id:
          description: The feature ID of the product item. If the item is a fixed price,
            should be `null`
          anyOf:
            - type: string
            - type: "null"
        feature_type:
          description: Single use features are used once and then depleted, like API calls
            or credits. Continuous use features are those being used on an
            ongoing-basis, like storage or seats.
          anyOf:
            - type: string
              enum:
                - single_use
                - continuous_use
                - boolean
                - static
            - type: "null"
        included_usage:
          description: The amount of usage included for this feature.
          anyOf:
            - anyOf:
                - type: number
                - type: string
                  const: inf
            - type: "null"
        interval:
          description: The reset or billing interval of the product item. If null, feature
            will have no reset date, and if there's a price, it will be billed
            one-off.
          anyOf:
            - type: string
              enum:
                - minute
                - hour
                - day
                - week
                - month
                - quarter
                - semi_annual
                - year
            - type: "null"
        interval_count:
          description: The interval count of the product item.
          anyOf:
            - type: number
            - type: "null"
        price:
          description: The price of the product item. Should be `null` if tiered pricing
            is set.
          anyOf:
            - type: number
            - type: "null"
        tiers:
          description: Tiered pricing for the product item. Not applicable for fixed price
            items.
          anyOf:
            - type: array
              items:
                type: object
                properties:
                  to:
                    anyOf:
                      - type: number
                      - type: string
                        const: inf
                    description: The maximum amount of usage for this tier.
                    example: 100
                  amount:
                    type: number
                    description: The price of the product item for this tier.
                    example: 10
                required:
                  - to
                  - amount
            - type: "null"
        usage_model:
          description: Whether the feature should be prepaid upfront or billed for how
            much they use end of billing period.
          anyOf:
            - type: string
              enum:
                - prepaid
                - pay_per_use
            - type: "null"
        billing_units:
          description: The amount per billing unit (eg. $9 / 250 units)
          anyOf:
            - type: number
            - type: "null"
        reset_usage_when_enabled:
          description: Whether the usage should be reset when the product is enabled.
          anyOf:
            - type: boolean
            - type: "null"
        entity_feature_id:
          description: The entity feature ID of the product item if applicable.
          anyOf:
            - type: string
            - type: "null"
        display:
          description: The display of the product item.
          anyOf:
            - type: object
              properties:
                primary_text:
                  type: string
                secondary_text:
                  anyOf:
                    - type: string
                    - type: "null"
              required:
                - primary_text
            - type: "null"
        quantity:
          description: Used in customer context. Quantity of the feature the customer has
            prepaid for.
          anyOf:
            - type: number
            - type: "null"
        next_cycle_quantity:
          description: Used in customer context. Quantity of the feature the customer will
            prepay for in the next cycle.
          anyOf:
            - type: number
            - type: "null"
        config:
          description: Configuration for rollover and proration behavior of the feature.
          anyOf:
            - type: object
              properties:
                rollover:
                  anyOf:
                    - type: object
                      properties:
                        max:
                          anyOf:
                            - type: number
                            - type: "null"
                        duration:
                          default: month
                          type: string
                          enum:
                            - month
                            - forever
                        length:
                          type: number
                      required:
                        - max
                        - length
                    - type: "null"
                on_increase:
                  anyOf:
                    - type: string
                      enum:
                        - bill_immediately
                        - prorate_immediately
                        - prorate_next_cycle
                        - bill_next_cycle
                    - type: "null"
                on_decrease:
                  anyOf:
                    - type: string
                      enum:
                        - prorate
                        - prorate_immediately
                        - prorate_next_cycle
                        - none
                        - no_prorations
                    - type: "null"
            - type: "null"
      description: Product item defining features and pricing within a product
    EventAggregateResponseFlat:
      allOf:
        - type: object
          properties:
            list:
              type: array
              items:
                type: object
                properties:
                  period:
                    type: number
                required:
                  - period
                additionalProperties:
                  type: number
          required:
            - list
          additionalProperties: false
        - type: object
          properties:
            total:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                type: object
                properties:
                  count:
                    type: number
                  sum:
                    type: number
                required:
                  - count
                  - sum
                additionalProperties: false
          required:
            - total
          additionalProperties: false
      title: No Group
