            const autumn = new Autumn();

            const feature = await autumn.features.get('feature_id');

            console.log(feature.id);
    post:
      summary: Update Feature
      tags:
        - features
      parameters:
        - in: path
          name: feature_id
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  description: The ID of the feature. This is used to refer to it in other API
                    calls like /track or /check.
                  type: string
                name:
                  description: The name of the feature.
                  type: string
                type:
                  description: The type of the feature. 'single_use' features are consumed, like
                    API calls, tokens, or messages. 'continuous_use' features
                    are allocated, like seats, workspaces, or projects.
                    'credit_system' features are schemas that unify multiple
                    'single_use' features into a single credit system.
                  type: string
                  enum:
                    - static
                    - boolean
                    - single_use
                    - continuous_use
                    - credit_system
                display:
                  description: Singular and plural display names for the feature in your user
                    interface.
                  type: object
                  properties:
                    singular:
                      type: string
                    plural:
                      type: string
                  required:
                    - singular
                    - plural
                credit_schema:
                  description: A schema that maps 'single_use' feature IDs to credit costs.
                    Applicable only for 'credit_system' features.
                  type: array
                  items:
                    type: object
                    properties:
                      metered_feature_id:
                        type: string
                      credit_cost:
                        type: number
                    required:
                      - metered_feature_id
                      - credit_cost
                archived:
                  description: Whether the feature is archived. Archived features are hidden from
                    the dashboard and list features endpoint.
                  type: boolean
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
      x-codeSamples:
        - lang: TypeScript
          source: |-
            import { Autumn } from 'autumn-js';

            const autumn = new Autumn();

            const feature = await autumn.features.update('feature_id');

            console.log(feature.id);
        - lang: Python
          source: |-
            import asyncio
            from autumn import Autumn

            autumn = Autumn("am_sk_1234567890")

            async def main():
                feature = await autumn.features.update(
                    feature_id="feature_id",
                )
                print(feature.id)

            asyncio.run(main())
    delete:
      summary: Delete Feature
      tags:
        - features
      parameters:
        - in: path
          name: feature_id
          schema:
            type: string
          required: true
      responses:
        "200":
          description: ""
