                additionalProperties: false
  /customers:
    get:
      summary: List Customers
      tags:
        - customers
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 10
            maximum: 100
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    description: List of customers
                    type: array
                    items: {}
                  total:
                    description: Total number of customers available
                    example: 100
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  limit:
                    description: Maximum number of customers returned
                    example: 10
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  offset:
                    description: Number of customers skipped before returning results
                    example: 0
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
                  - list
                  - total
                  - limit
                  - offset
                additionalProperties: false
      x-codeSamples:
        - lang: TypeScript
          source: |-
            import { Autumn } from 'autumn-js';

            const autumn = new Autumn();

            const customers = await autumn.customers.list();

            console.log(customers.limit);
        - lang: Python
          source: |-
            import asyncio
            from autumn import Autumn

            autumn = Autumn("am_sk_1234567890")

            async def main():
                customers = await autumn.customers.list()
                print(customers.limit)

            asyncio.run(main())
    post:
      summary: Create Customer
      tags:
        - customers
      parameters:
        - in: query
          name: expand
          schema:
            type: array
            items:
              type: string
              enum:
                - invoices
                - trials_used
                - rewards
                - entities
                - referrals
                - payment_method
                - upcoming_invoice
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  description: Your unique identifier for the customer
                  example: cus_123
                  anyOf:
                    - type: string
                    - type: "null"
                name:
                  description: Customer's name
                  example: John Doe
                  anyOf:
                    - type: string
                    - type: "null"
                email:
                  description: Customer's email address
                  example: john@example.com
                  anyOf:
                    - type: string
                      format: email
                      pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                    - type: "null"
                fingerprint:
                  description: Unique identifier (eg, serial number) to detect duplicate customers
                    and prevent free trial abuse
                  example: fp_123abc
                  type: string
                metadata:
                  description: Additional metadata for the customer
                  example:
                    company: Acme Inc
                  default: {}
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
                stripe_id:
                  description: Stripe customer ID if you already have one
                  example: cus_stripe123
                  type: string
                entity_id:
                  description: Entity ID to associate with the customer
                  example: entity_123
                  type: string
                entity_data:
                  description: Data for creating an entity
                  type: object
                  properties:
                    feature_id:
                      description: The feature ID that this entity is associated with
                      example: seats
                      type: string
                    name:
                      description: Name of the entity
                      example: Team Alpha
                      type: string
                  required:
                    - feature_id
              required:
                - id
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
      x-codeSamples:
        - lang: TypeScript
          source: |-
            import { Autumn } from 'autumn-js';

            const autumn = new Autumn();

            const customer = await autumn.customers.create({ id: 'cus_123' });

            console.log(customer.id);
        - lang: Python
          source: |-
            import asyncio
            from autumn import Autumn

            autumn = Autumn("am_sk_1234567890")

            async def main():
                customer = await autumn.customers.create(
                    id="cus_123",
                )
                print(customer.id)

            asyncio.run(main())
