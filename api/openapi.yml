openapi: 3.1.0
info:
  title: Autumn API
  version: 1.2.0
servers:
  - url: https://api.useautumn.com
    description: Production server
security:
  - secretKey: []
paths:
  /products:
    post:
      summary: Create Product
      tags:
        - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductParams'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Autumn from 'autumn-typescript';

            const client = new Autumn({
              secretKey: 'My Secret Key',
            });

            const product = await client.products.create({ id: 'id', name: 'name' });

            console.log(product.id);
    patch:
      summary: Update Product
      tags:
        - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductParams'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Autumn from 'autumn-typescript';

            const client = new Autumn({
              secretKey: 'My Secret Key',
            });

            const product = await client.products.update();

            console.log(product.id);
  /core/attach:
    post:
      summary: Attach Product
      tags:
        - core
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  description: ID of the customer to attach the product to
                  type: string
                customer_data:
                  description: Customer data if using attach to auto create customer
                  anyOf:
                    - {}
                    - type: 'null'
                entity_id:
                  anyOf:
                    - type: string
                    - type: 'null'
                entity_data:
                  anyOf:
                    - {}
                    - type: 'null'
                product_id:
                  anyOf:
                    - type: string
                    - type: 'null'
                product_ids:
                  anyOf:
                    - minItems: 1
                      type: array
                      items:
                        type: string
                    - type: 'null'
                options:
                  anyOf:
                    - type: array
                      items:
                        type: object
                        properties:
                          feature_id:
                            type: string
                          quantity:
                            type: number
                          upcoming_quantity:
                            anyOf:
                              - type: number
                              - type: 'null'
                          adjustable_quantity:
                            anyOf:
                              - type: boolean
                              - type: 'null'
                          internal_feature_id:
                            anyOf:
                              - type: string
                              - type: 'null'
                        required:
                          - feature_id
                          - quantity
                    - type: 'null'
                free_trial:
                  type: boolean
                success_url:
                  type: string
                force_checkout:
                  type: boolean
                checkout_session_params: {}
                reward:
                  anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                invoice:
                  type: boolean
                skip_checkout:
                  type: boolean
                setup_payment:
                  type: boolean
              required:
                - customer_id
                - free_trial
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_id:
                    type: string
                  product_ids:
                    type: array
                    items:
                      type: string
                  code:
                    type: string
                  message:
                    type: string
                  checkout_url:
                    anyOf:
                      - type: string
                      - type: 'null'
                  invoice:
                    anyOf:
                      - {}
                      - type: 'null'
                required:
                  - customer_id
                  - product_ids
                  - code
                  - message
                additionalProperties: false
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Autumn from 'autumn-typescript';

            const client = new Autumn({
              secretKey: 'My Secret Key',
            });

            const response = await client.core.attach({ customer_id: 'customer_id', free_trial: true });

            console.log(response.customer_id);
  /core/checkout:
    post:
      summary: Checkout
      tags:
        - core
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  description: ID of the customer to attach the product to
                  type: string
                customer_data:
                  description: Customer data if using attach to auto create customer
                  anyOf:
                    - {}
                    - type: 'null'
                entity_id:
                  anyOf:
                    - type: string
                    - type: 'null'
                entity_data:
                  anyOf:
                    - {}
                    - type: 'null'
                product_id:
                  anyOf:
                    - type: string
                    - type: 'null'
                product_ids:
                  anyOf:
                    - minItems: 1
                      type: array
                      items:
                        type: string
                    - type: 'null'
                options:
                  anyOf:
                    - type: array
                      items:
                        type: object
                        properties:
                          feature_id:
                            type: string
                          quantity:
                            type: number
                          upcoming_quantity:
                            anyOf:
                              - type: number
                              - type: 'null'
                          adjustable_quantity:
                            anyOf:
                              - type: boolean
                              - type: 'null'
                          internal_feature_id:
                            anyOf:
                              - type: string
                              - type: 'null'
                        required:
                          - feature_id
                          - quantity
                    - type: 'null'
                free_trial:
                  type: boolean
                success_url:
                  type: string
                force_checkout:
                  type: boolean
                checkout_session_params: {}
                reward:
                  anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                invoice:
                  type: boolean
                skip_checkout:
                  type: boolean
                setup_payment:
                  type: boolean
              required:
                - customer_id
                - free_trial
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    anyOf:
                      - type: string
                      - type: 'null'
                  customer_id:
                    type: string
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        description:
                          type: string
                        amount:
                          type: number
                        item:
                          anyOf:
                            - $ref: '#/components/schemas/ProductItem'
                            - type: 'null'
                      required:
                        - description
                        - amount
                      additionalProperties: false
                  product:
                    anyOf:
                      - $ref: '#/components/schemas/Product'
                      - type: 'null'
                  current_product:
                    anyOf:
                      - $ref: '#/components/schemas/Product'
                      - type: 'null'
                  options:
                    anyOf:
                      - type: array
                        items:
                          type: object
                          properties:
                            feature_id:
                              type: string
                            quantity:
                              type: number
                            upcoming_quantity:
                              anyOf:
                                - type: number
                                - type: 'null'
                            adjustable_quantity:
                              anyOf:
                                - type: boolean
                                - type: 'null'
                            internal_feature_id:
                              anyOf:
                                - type: string
                                - type: 'null'
                          required:
                            - feature_id
                            - quantity
                          additionalProperties: false
                      - type: 'null'
                  total:
                    anyOf:
                      - type: number
                      - type: 'null'
                  currency:
                    anyOf:
                      - type: string
                      - type: 'null'
                  has_prorations:
                    anyOf:
                      - type: boolean
                      - type: 'null'
                  next_cycle:
                    anyOf:
                      - type: object
                        properties:
                          starts_at:
                            anyOf:
                              - type: number
                              - type: 'null'
                          total:
                            anyOf:
                              - type: number
                              - type: 'null'
                        additionalProperties: false
                      - type: 'null'
                required:
                  - customer_id
                  - lines
                additionalProperties: false
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Autumn from 'autumn-typescript';

            const client = new Autumn({
              secretKey: 'My Secret Key',
            });

            const response = await client.core.checkout({ customer_id: 'customer_id', free_trial: true });

            console.log(response.customer_id);
  /core/cancel:
