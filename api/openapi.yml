  /customers:
    get:
      summary: List Customers
      tags:
        - customers
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 10
            maximum: 100
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCustomersResponse'
      x-codeSamples:
