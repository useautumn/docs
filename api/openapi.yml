          description: The timestamp of when the product was created in milliseconds since epoch
          example: 1759247877000
          type: number
        items:
          description: Array of product items that define the features and pricing
          example:
            - feature_id: <string>
              feature_type: single_use
              included_usage: 123
              interval: <string>
              usage_model: prepaid
              price: 123
              billing_units: 123
              entity_feature_id: <string>
              reset_usage_when_enabled: true
              tiers:
                - to: 123
                  amount: 123
          type: array
          items:
            $ref: '#/components/schemas/ProductItem'
        free_trial:
