      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Autumn from 'autumn-typescript';

            const client = new Autumn({
              secretKey: 'My Secret Key',
            });

            const response = await client.core.track({ customer_id: 'cus_123' });

            console.log(response.id);
  /core/query:
    post:
      summary: Query Analytics
      tags:
        - core
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryParams'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Autumn from 'autumn-typescript';

            const client = new Autumn({
              secretKey: 'My Secret Key',
            });

            const response = await client.core.query({ customer_id: 'cus_123', feature_id: 'api_calls' });

            console.log(response.list);
  /features:
    get:
      summary: List Features
      tags:
        - features
      parameters:
        - in: query
          name: include_archived
          schema:
            type: boolean
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureListResponse'
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Autumn from 'autumn-typescript';

            const client = new Autumn({
              secretKey: 'My Secret Key',
            });

            const features = await client.features.list();

            console.log(features.list);
    post:
      summary: Create Feature
      tags:
        - features
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeatureParams'
      responses:
        '200':
          description: 200 OK
