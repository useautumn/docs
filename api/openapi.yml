                    ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                - type: string
                  const: ''
            - type: 'null'
        fingerprint:
          description: Unique identifier (eg, serial number) to detect duplicate customers
          example: fp_123abc
          anyOf:
            - type: string
            - type: 'null'
        metadata:
          description: Additional metadata for the customer (set individual keys to null to delete them)
