    CreateCustomerParams:
      description: Parameters for creating a customer
      type: object
      properties:
        id:
          description: Your unique identifier for the customer
          example: cus_123
          anyOf:
            - type: string
            - type: 'null'
        name:
          description: Customer's name
          example: John Doe
          anyOf:
            - type: string
            - type: 'null'
        email:
          description: Customer's email address
          example: john@example.com
          anyOf:
            - anyOf:
                - type: string
                  format: email
                  pattern: >-
                    ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                - type: string
                  const: ''
            - type: 'null'
        fingerprint:
          description: Unique identifier (eg, serial number) to detect duplicate customers and prevent free trial abuse
          example: fp_123abc
          anyOf:
            - type: string
            - type: 'null'
        metadata:
          description: Additional metadata for the customer
          example:
            company: Acme Inc
          anyOf:
            - default: {}
              type: object
              propertyNames: {}
              additionalProperties: {}
            - type: 'null'
        stripe_id:
          description: Stripe customer ID if you already have one
          example: cus_stripe123
          anyOf:
            - type: string
            - type: 'null'
        entity_id:
          description: Entity ID to associate with the customer
          example: entity_123
          anyOf:
            - type: string
            - type: 'null'
        entity_data:
          description: Data for creating an entity
          example:
            name: Team Alpha
            feature_id: seats
          anyOf:
            - {}
            - type: 'null'
    UpdateCustomerParams:
